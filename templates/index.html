<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KB</title>
<!-- CodeMirror 5 (CDN 6.65.7 is actually 5.65.7) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/selection/active-line.min.js"></script>
<!-- markdown-it -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.2/markdown-it.min.js"></script>
<!-- Frappe Gantt -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
<script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
<style>
/* ═══════════════ Design tokens ═══════════════
   布局 token 与主题 token 分离:
   主题色在 [data-theme] 上,间距/圆角/阴影/缓动恒定 */
:root {
  --accent: #7aa2f7;
  --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;
  --ease: cubic-bezier(0.2, 0.6, 0.3, 1);
  --font-mono: 'SF Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace;
}
[data-theme="dark"] {
  /* Tokyo Night */
  --bg: #1a1b26; --bg-soft: #16161e;
  --fg: #c0caf5; --muted: #565f89;
  --accent: #7aa2f7; --accent-dim: rgba(122, 162, 247, 0.14);
  --border: #292e42; --border-soft: #1f2335;
  --card: #16161e; --hover: #1f2335;
  --tag: #bb9af7; --tag-dim: rgba(187, 154, 247, 0.12);
  --overdue: #ff757f;
  --p1: #ff757f; --p2: #ff9e64; --p3: #e0af68; --p4: #9ece6a;
  --shadow-1: 0 1px 3px rgba(0, 0, 0, 0.4);
  --shadow-2: 0 8px 28px rgba(0, 0, 0, 0.5);
}
[data-theme="light"] {
  --bg: #f6f7f9; --bg-soft: #ffffff;
  --fg: #24292f; --muted: #6e7781;
  --accent: #3b6ea5; --accent-dim: #e8f0fb;
  --border: #e2e6ea; --border-soft: #eef0f3;
  --card: #ffffff; --hover: #eef0f3;
  --tag: #8250df; --tag-dim: rgba(130, 80, 223, 0.08);
  --overdue: #cf222e;
  --p1: #d73a49; --p2: #e67e22; --p3: #d4a72c; --p4: #2da44e;
  --shadow-1: 0 1px 3px rgba(140, 149, 159, 0.25);
  --shadow-2: 0 8px 28px rgba(140, 149, 159, 0.3);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f7f9; --bg-soft: #ffffff;
    --fg: #24292f; --muted: #6e7781;
    --accent: #3b6ea5; --accent-dim: #e8f0fb;
    --border: #e2e6ea; --border-soft: #eef0f3;
    --card: #ffffff; --hover: #eef0f3;
    --tag: #8250df; --tag-dim: rgba(130, 80, 223, 0.08);
    --overdue: #cf222e;
    --p1: #d73a49; --p2: #e67e22; --p3: #d4a72c; --p4: #2da44e;
    --shadow-1: 0 1px 3px rgba(140, 149, 159, 0.25);
    --shadow-2: 0 8px 28px rgba(140, 149, 159, 0.3);
  }
}

/* ═══════════════ Base ═══════════════ */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
    'PingFang SC', 'Hiragino Sans GB', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif;
  font-size: 14px;
  background: var(--bg);
  color: var(--fg);
  display: flex;
  height: 100vh;
  overflow: hidden;
}
/* Themed scrollbars */
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
/* Keyboard focus */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input:focus-visible, textarea:focus-visible { outline: none; }
/* Respect reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

button {
  font-family: inherit;
  background: none;
  border: none;
  color: inherit;
  cursor: pointer;
}
input, textarea, select {
  font-family: inherit;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--fg);
  border-radius: var(--r-sm);
  padding: 7px 12px;
  font-size: 13.5px;
  transition: border-color 0.15s var(--ease);
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
input::placeholder, textarea::placeholder { color: var(--muted); }
label { display: block; font-size: 13px; font-weight: 500; margin: 14px 0 6px; }
code {
  font-family: var(--font-mono);
  background: var(--tag-dim);
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 0.92em;
}

/* ═══════════════ Layout ═══════════════ */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
#header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#search-input { flex: 1; min-width: 0; }
.hbtn {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--fg);
  padding: 6px 12px;
  border-radius: var(--r-sm);
  font-size: 13px;
  white-space: nowrap;
  transition: border-color 0.15s var(--ease), color 0.15s var(--ease), background 0.15s var(--ease);
}
.hbtn:hover { border-color: var(--accent); color: var(--accent); }
.hbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.hbtn.primary:hover { filter: brightness(1.08); color: #fff; }
#theme-toggle { padding: 6px 9px; font-size: 15px; }
#content { flex: 1; overflow-y: auto; padding: var(--sp-6) var(--sp-5) 96px; }
#content.graph-active { padding: var(--sp-4); display: flex; flex-direction: column; }

/* Narrow reading column shared by list views */
.list-col { max-width: 720px; margin: 0 auto; }

.view-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: var(--sp-2);
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.view-title .count { color: var(--muted); font-size: 13px; font-weight: 400; }

/* ═══════════════ Sidebar ═══════════════ */
#sidebar {
  width: 232px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  border-right: 1px solid var(--border);
  overflow: hidden;
  transition: width 0.2s var(--ease);
}
#sidebar-header {
  padding: 16px 16px 14px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.01em;
  display: flex;
  align-items: center;
  gap: 8px;
}
#sidebar-header a { color: var(--fg); text-decoration: none; }
#sidebar-toggle {
  margin-left: auto;
  flex-shrink: 0;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 2px 7px;
  border-radius: var(--r-sm);
  font-size: 11px;
  line-height: 1.5;
}
#sidebar-toggle:hover { border-color: var(--accent); color: var(--accent); }
#nav { padding: 4px 0; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 14px;
  margin: 1px 8px;
  border-radius: var(--r-sm);
  color: var(--fg);
  opacity: 0.78;
  text-decoration: none;
  font-size: 13.5px;
  cursor: pointer;
  position: relative;
  transition: background 0.12s var(--ease), opacity 0.12s var(--ease);
}
.nav-item:hover { background: var(--hover); opacity: 1; }
.nav-item.active {
  background: var(--accent-dim);
  color: var(--accent);
  opacity: 1;
  font-weight: 500;
}
.nav-item.active::before {
  content: '';
  position: absolute;
  left: -8px;
  top: 22%;
  bottom: 22%;
  width: 3px;
  border-radius: 2px;
  background: var(--accent);
}
.nav-icon { flex-shrink: 0; font-size: 15px; }
#tags-section {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 8px 0;
  border-top: 1px solid var(--border);
  margin-top: 8px;
}
#tags-section h3 {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--muted);
  padding: 8px 22px 4px;
}
.tag-item {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  padding: 5px 14px;
  margin: 0 8px;
  border-radius: var(--r-sm);
  font-size: 13px;
  color: var(--tag);
  cursor: pointer;
}
.tag-item:hover { background: var(--hover); }
.tag-item span:first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.tag-item .count { color: var(--muted); font-size: 11.5px; }
#sidebar-settings {
  border-top: 1px solid var(--border);
  padding: 8px;
}
#sidebar-settings-btn {
  width: 100%;
  padding: 7px 14px;
  border-radius: var(--r-sm);
  color: var(--muted);
  font-size: 13px;
  text-align: left;
}
#sidebar-settings-btn:hover { background: var(--hover); color: var(--fg); }
/* Narrow mode (desktop) */
#sidebar.narrow { width: 56px; }
#sidebar.narrow #sidebar-header { padding: 16px 8px; justify-content: center; }
#sidebar.narrow #sidebar-header a,
#sidebar.narrow #tags-section,
#sidebar.narrow .nav-text { display: none; }
#sidebar.narrow #nav { padding: 4px; }
#sidebar.narrow .nav-item { justify-content: center; padding: 10px 0; margin: 1px 4px; font-size: 17px; }
#sidebar.narrow .nav-item.active::before { left: -4px; }
#sidebar.narrow #sidebar-settings-btn { text-align: center; font-size: 16px; padding: 8px 0; }

/* ═══════════════ Time-grouped lists ═══════════════ */
.time-group {
  margin: var(--sp-5) 0 var(--sp-1);
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
}
.time-group:first-child { margin-top: 0; }
.page-list-item {
  padding: 9px 4px;
  border-bottom: 1px solid var(--border-soft);
  cursor: pointer;
}
.page-list-item:hover .title { color: var(--accent); }
.page-list-item .row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
}
.page-list-item .title { font-weight: 500; font-size: 14.5px; overflow-wrap: anywhere; }
.page-list-item .meta { color: var(--muted); font-size: 12px; white-space: nowrap; flex-shrink: 0; }
.page-list-item mark {
  background: var(--accent-dim);
  color: var(--accent);
  border-radius: 2px;
  padding: 0 1px;
}
.empty-hint {
  padding: var(--sp-6) var(--sp-4);
  text-align: center;
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.7;
}

/* ═══════════════ Page view (reading) ═══════════════ */
#page-view { max-width: 720px; margin: 0 auto; }
#page-view h1 { margin-bottom: 10px; font-size: 30px; font-weight: 700; letter-spacing: 0.01em; }
#page-view .meta {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: var(--sp-5);
  display: flex;
  gap: 16px;
  align-items: center;
}
#page-view .meta a { color: var(--accent); text-decoration: none; }
#page-view .meta a:hover { text-decoration: underline; }
.tags-display { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: var(--sp-5); }
.tag-chip {
  background: var(--tag-dim);
  color: var(--tag);
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12px;
  cursor: pointer;
  transition: background 0.12s var(--ease);
}
.tag-chip:hover { background: var(--tag); color: var(--bg); }
#page-content { line-height: 1.85; font-size: 15px; }
#page-content h1, #page-content h2, #page-content h3 { margin: 1.6em 0 0.7em; line-height: 1.35; }
#page-content h1 { font-size: 23px; }
#page-content h2 { font-size: 19px; }
#page-content h3 { font-size: 16.5px; }
#page-content p { margin: 0.9em 0; }
#page-content ul, #page-content ol { margin: 0.9em 0; padding-left: 24px; }
#page-content li { margin: 4px 0; }
#page-content code { background: var(--card); padding: 2px 6px; border-radius: 3px; font-size: 13px; }
#page-content pre {
  background: var(--card);
  border: 1px solid var(--border-soft);
  padding: 12px 16px;
  border-radius: var(--r-md);
  overflow-x: auto;
  margin: 16px 0;
}
#page-content pre code { background: none; padding: 0; }
#page-content blockquote {
  border-left: 3px solid var(--accent);
  padding-left: 16px;
  margin: 16px 0;
  color: var(--muted);
}
#page-content a { color: var(--accent); }
#page-content a:hover { text-decoration: underline; }
#page-content a.wikilink.unresolved { color: var(--muted); text-decoration: underline dotted; }
#page-content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
#page-content table { border-collapse: collapse; margin: 16px 0; width: 100%; font-size: 14px; }
#page-content th, #page-content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
#page-content th { background: var(--card); font-weight: 600; }
#page-content img { max-width: 100%; border-radius: var(--r-sm); }
/* Mermaid diagrams: base style is a code block; replaced by centered SVG after render */
.mermaid {
  margin: 16px 0;
  padding: 12px 16px;
  background: var(--card);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-md);
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted);
  white-space: pre-wrap;
  overflow-x: auto;
  line-height: 1.6;
}
.mermaid svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.mermaid-error { border-color: var(--overdue); }
.mermaid-error::before {
  content: '⚠ mermaid 语法错误，已保留原码';
  display: block;
  color: var(--overdue);
  font-family: inherit;
  white-space: normal;
  margin-bottom: 8px;
}
/* Unrendered source inside hover-preview cards stays compact */
.lp-body .mermaid { margin: 8px 0; }
/* Embed transclusion (![[page]]) — dashboard and inline use */
.kb-embed {
  margin: 14px 0;
  padding: 14px 18px;
  border-left: 3px solid var(--accent);
  background: var(--card);
  border-radius: 0 var(--r-md) var(--r-md) 0;
  font-size: 14px;
}
.kb-embed > :first-child { margin-top: 0; }
.kb-embed > :last-child { margin-bottom: 0; }
.kb-embed .kb-embed { border-left-color: var(--border); }  /* deeper level recedes */
.kb-embed-max, .kb-embed-loading { color: var(--muted); font-size: 12.5px; }
.kb-embed-missing { border-left-color: var(--muted); background: transparent; }
.kb-embed-create { cursor: pointer; color: var(--muted); font-size: 13px; }
.kb-embed-create:hover { color: var(--accent); }
.dashboard-toolbar { display: flex; justify-content: flex-end; margin-bottom: 6px; }
.dashboard { margin-bottom: var(--sp-5); }
/* Draft recovery bar (editor) */
#draft-bar {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 7px 16px;
  background: var(--accent-dim);
  font-size: 13px;
  color: var(--fg);
  border-bottom: 1px solid var(--border);
}
.draft-btn {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--accent);
  padding: 3px 12px;
  border-radius: var(--r-sm);
  font-size: 12.5px;
  white-space: nowrap;
}
.draft-btn:hover { border-color: var(--accent); }
/* Keyboard navigation highlight (j/k) */
.knav-active {
  background: var(--hover);
  box-shadow: inset 3px 0 0 var(--accent);
}
/* Health report (orphans / broken links) inside all-pages */
.health-item { padding: 9px 4px; border-bottom: 1px solid var(--border-soft); }
.health-item .row { display: flex; align-items: baseline; gap: 10px; }
.health-item .src { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.health-item .src a { color: var(--accent); text-decoration: none; }
.health-item .src a:hover { text-decoration: underline; }
#backlinks { margin-top: var(--sp-7); padding-top: var(--sp-5); border-top: 1px solid var(--border); }
#backlinks h3 { font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: var(--sp-2); }
.backlink-item { padding: 10px 4px; border-bottom: 1px solid var(--border-soft); cursor: pointer; }
.backlink-item:last-child { border-bottom: none; }
.backlink-item:hover .title { color: var(--accent); }
.backlink-item .title { font-weight: 500; font-size: 14px; }
.backlink-item .snippet {
  color: var(--muted);
  font-size: 13px;
  margin: 3px 0 2px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
  line-height: 1.6;
}
.backlink-item .meta { color: var(--muted); font-size: 12px; }

/* ═══════════════ Toolbar rows (all-pages / graph / todo headers) ═══════════════ */
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: var(--sp-4);
  flex-wrap: wrap;
}
.toolbar .spacer { flex: 1; }
.btn-imp {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--fg);
  padding: 6px 12px;
  border-radius: var(--r-sm);
  font-size: 13px;
  cursor: pointer;
  transition: border-color 0.15s var(--ease), color 0.15s var(--ease);
}
.btn-imp:hover { border-color: var(--accent); color: var(--accent); }
#all-pages-filter { width: 100%; margin-bottom: var(--sp-4); }
.trash-toggle {
  color: var(--muted);
  font-size: 13.5px;
  padding: 10px 0 6px;
  border-top: 1px solid var(--border);
  margin-top: var(--sp-5);
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  width: 100%;
  text-align: left;
}
.trash-toggle:hover { color: var(--fg); }
.trash-toggle .hint { font-size: 12px; }
.restore-btn {
  background: var(--accent-dim);
  color: var(--accent);
  border: 1px solid transparent;
  padding: 4px 10px;
  border-radius: var(--r-sm);
  font-size: 12px;
}
.restore-btn:hover { background: var(--accent); color: #fff; }

/* ═══════════════ Journal nav ═══════════════ */
.journal-nav { display: flex; gap: 8px; align-items: center; flex: 1; }
.journal-nav input[type="date"] { padding: 6px 10px; font-size: 13.5px; }

/* ═══════════════ TODO view ═══════════════ */
#todo-view { display: none; }
#todo-view.gantt-active #gantt-view-modes { display: flex; }
#todo-header { display: flex; align-items: center; gap: 12px; margin-bottom: var(--sp-4); flex-wrap: wrap; }
#todo-header h2 { margin: 0; font-size: 16px; font-weight: 600; }
#todo-page-switch {
  background: var(--card);
  color: var(--fg);
  padding: 6px 10px;
  font-size: 13px;
  max-width: 200px;
  cursor: pointer;
}
#todo-tabs { display: flex; gap: 2px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 2px; }
#todo-tabs button {
  color: var(--muted);
  padding: 5px 14px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 13px;
}
#todo-tabs button.active { background: var(--accent-dim); color: var(--accent); font-weight: 500; }
#gantt-view-modes { display: none; align-items: center; gap: 6px; }
#gantt-view-modes button {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  padding: 4px 10px;
  border-radius: var(--r-sm);
  cursor: pointer;
  font-size: 12px;
}
#gantt-view-modes button.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
#gantt-view-modes input[type="date"] { padding: 3px 6px; font-size: 12px; }
#todo-content { flex: 1; overflow: auto; }
.todo-quickadd {
  width: 100%;
  padding: 10px 14px;
  font-size: 13.5px;
  margin-bottom: var(--sp-3);
}
.todo-stats { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: var(--sp-3); }
.todo-stat {
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 12.5px;
}
.todo-stat:hover { border-color: var(--accent); color: var(--fg); }
.todo-stat.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.todo-sort {
  margin-left: auto;
  background: var(--card);
  color: var(--fg);
  padding: 5px 8px;
  font-size: 12.5px;
}
.todo-list-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 8px;
  border-bottom: 1px solid var(--border-soft);
}
.todo-list-item.task-done { opacity: 0.45; }
.todo-list-item.task-done .task-title { text-decoration: line-through; }
.todo-list-item .task-check {
  width: 16px; height: 16px;
  cursor: pointer;
  accent-color: var(--accent);
  flex-shrink: 0;
}
.todo-list-item .priority {
  width: 22px; height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10.5px;
  font-weight: 600;
  color: #fff;
  flex-shrink: 0;
}
.todo-list-item .priority.p1 { background: var(--p1); }
.todo-list-item .priority.p2 { background: var(--p2); }
.todo-list-item .priority.p3 { background: var(--p3); color: var(--bg); }
.todo-list-item .priority.p4 { background: var(--p4); color: var(--bg); }
.todo-list-item .task-info { flex: 1; min-width: 0; }
.todo-list-item .task-title { font-weight: 500; font-size: 14px; }
.todo-list-item .task-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.todo-list-item .task-meta a { color: var(--accent); text-decoration: none; }
.todo-list-item .task-meta a:hover { text-decoration: underline; }
.todo-list-item .task-due { font-size: 12.5px; color: var(--muted); flex-shrink: 0; }
.todo-list-item .task-due.overdue { color: var(--overdue); font-weight: 600; }
.todo-list-item .rec-badge { font-size: 11px; }

/* Frappe Gantt: themed via vars (bars colored by JS with priority vars) */
#gantt-area { width: 100%; overflow-x: auto; }
.gantt .grid-background { fill: var(--bg); }
.gantt .grid-row { fill: var(--bg); }
.gantt .grid-row:nth-child(even) { fill: var(--card); opacity: 0.55; }
.gantt .grid-header { fill: var(--card); }
.gantt .row-line, .gantt .tick, .gantt .header-line { stroke: var(--border) !important; }
.gantt .lower-text, .gantt .upper-text { fill: var(--muted) !important; }
.gantt .bar-label { fill: var(--fg) !important; font-size: 11px !important; font-weight: 500; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
.gantt .bar-invalid { fill: var(--border) !important; }
.gantt .bar-progress { fill: var(--accent) !important; }

/* ═══════════════ Graph (signature view) ═══════════════ */
#graph-view { display: none; flex-direction: column; flex: 1; min-height: 0; }
.graph-container {
  width: 100%;
  flex: 1;
  min-height: 200px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
  position: relative;
}
.graph-container svg { touch-action: none; }
#graph-stats { color: var(--muted); font-size: 12.5px; }
#graph-tooltip {
  position: absolute;
  display: none;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  box-shadow: var(--shadow-1);
  padding: 5px 10px;
  font-size: 12px;
  pointer-events: none;
  z-index: 10;
}
.gnode { transition: r 0.12s var(--ease); }
.gedge { stroke: var(--border); }
.gedge.gedge-hot { stroke: var(--accent); stroke-width: 1.6; }
.gnode.gnode-dim { fill: var(--muted); opacity: 0.55; }
.gnode.gnode-hot { stroke: var(--accent); stroke-width: 2; }
.glabel { fill: var(--fg); font-size: 11px; pointer-events: none; }

/* ═══════════════ Editor ═══════════════ */
#editor { display: none; }
#editor-layout { display: flex; height: 100%; }
#editor-pane {
  width: 50%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  overflow: hidden;
  min-width: 0;
}
#editor-header {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  align-items: center;
}
#page-name { flex: 1; font-size: 15px; font-weight: 600; border: none; background: transparent; border-radius: 0; padding: 6px 2px; }
#page-name:focus { background: var(--card); }
.ebtn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 6px 10px;
  border-radius: var(--r-sm);
  font-size: 13px;
  white-space: nowrap;
}
.ebtn:hover { border-color: var(--accent); color: var(--accent); }
#editor-footer {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  border-top: 1px solid var(--border);
  font-size: 12.5px;
  color: var(--muted);
}
#editor-footer label {
  display: flex;
  align-items: center;
  gap: 5px;
  margin: 0;
  font-size: 12.5px;
  font-weight: 400;
  color: var(--muted);
  cursor: pointer;
  margin-left: auto;
}
#editor-footer input[type="checkbox"] { accent-color: var(--accent); }
#save-btn, #fab-save { background: var(--accent); color: #fff; border: none; border-radius: var(--r-sm); padding: 7px 16px; font-size: 13px; font-weight: 500; }
#save-btn:hover { filter: brightness(1.08); }
#divider {
  width: 6px;
  background: transparent;
  border-left: 1px solid var(--border);
  cursor: col-resize;
  flex-shrink: 0;
  margin-left: -3px;
  position: relative;
  z-index: 2;
  transition: border-color 0.15s var(--ease);
}
#divider:hover, #divider.dragging { border-left-color: var(--accent); }
#preview-pane {
  width: 50%;
  flex: 1;
  padding: var(--sp-4) var(--sp-5);
  overflow-y: auto;
  min-width: 0;
  background: var(--bg);
}
#preview-pane > * { max-width: 720px; margin-left: auto; margin-right: auto; }
/* CodeMirror: harmonize with page palette (body prefix outranks CDN theme CSS) */
.CodeMirror { font-family: inherit; background: var(--bg); color: var(--fg); height: 100%; font-size: 14.5px; line-height: 1.7; }
body .cm-s-dracula.CodeMirror { background: var(--bg); color: var(--fg); }
body .cm-s-dracula .CodeMirror-gutters { background: var(--bg); border-right: 1px solid var(--border); }
body .cm-s-dracula .CodeMirror-cursor { border-left: 2px solid var(--accent); }
body .cm-s-dracula .CodeMirror-selected { background: var(--accent-dim) !important; }
body .cm-s-dracula .CodeMirror-activeline-background { background: var(--card); }
body .cm-s-dracula .CodeMirror-linenumber { color: var(--muted); }

/* ═══════════════ Popovers & menus ═══════════════ */
#slash-menu, #ref-autocomplete {
  position: absolute;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-2);
  z-index: 1000;
  display: none;
  min-width: 220px;
  max-height: 300px;
  overflow-y: auto;
  padding: 4px;
}
#ref-autocomplete { min-width: 250px; max-height: 220px; }
.slash-item, .ref-item {
  padding: 8px 10px;
  cursor: pointer;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  border-radius: var(--r-sm);
}
.slash-item:hover, .slash-item.active,
.ref-item:hover, .ref-item.active { background: var(--accent-dim); }
.slash-item .key { color: var(--muted); font-size: 11px; }
.ref-item .ref-title { font-weight: 500; }
.ref-item .ref-meta { color: var(--muted); font-size: 11px; }

/* ═══════════════ Panels (settings / version) ═══════════════ */
#settings-panel {
  position: fixed;
  inset: 0;
  z-index: 500;
  display: none;
}
#settings-panel.open { display: block; }
#settings-panel .panel {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 520px;
  max-width: calc(100vw - 32px);
  max-height: calc(100vh - 64px);
  overflow-y: auto;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-2);
  padding: var(--sp-5);
}
#settings-panel .panel h3 { font-size: 15px; margin-bottom: var(--sp-2); }
#setting-custom-css {
  width: 100%;
  height: 120px;
  font-family: var(--font-mono);
  font-size: 12px;
  resize: vertical;
}
.tpl-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 4px; }
.tpl-btn {
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 3px 10px;
  border-radius: var(--r-sm);
  font-size: 12px;
}
.tpl-btn:hover { border-color: var(--accent); color: var(--accent); }
.rec-doc { font-size: 12px; color: var(--muted); line-height: 1.7; }
.panel-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: var(--sp-4); }
.panel-btns .btn-cancel { border: 1px solid var(--border); color: var(--fg); padding: 7px 16px; border-radius: var(--r-sm); font-size: 13px; }
.panel-btns .btn-cancel:hover { border-color: var(--accent); color: var(--accent); }
.panel-btns .btn-primary { background: var(--accent); color: #fff; padding: 7px 16px; border-radius: var(--r-sm); font-size: 13px; font-weight: 500; }
.panel-btns .btn-primary:hover { filter: brightness(1.08); }

#version-panel {
  position: fixed;
  top: 0; bottom: 0; right: 0;
  width: 420px;
  max-width: calc(100vw - 32px);
  background: var(--card);
  border-left: 1px solid var(--border);
  box-shadow: var(--shadow-2);
  transform: translateX(100%);
  transition: transform 0.22s var(--ease);
  display: flex;
  flex-direction: column;
  z-index: 500;
}
#version-panel.open { transform: translateX(0); }
.vp-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--sp-4);
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.vp-header button { color: var(--muted); font-size: 17px; padding: 2px 6px; }
.vp-header button:hover { color: var(--fg); }
.vp-list { flex: 1; overflow-y: auto; padding: 8px; }
.vp-item {
  padding: 10px 12px;
  border-radius: var(--r-sm);
  cursor: pointer;
  font-size: 13px;
}
.vp-item:hover { background: var(--hover); }
.vp-item.selected { background: var(--accent-dim); }
.vp-preview {
  border-top: 1px solid var(--border);
  padding: var(--sp-3) var(--sp-4);
  font-family: var(--font-mono);
  font-size: 12px;
  white-space: pre-wrap;
  color: var(--muted);
  max-height: 40vh;
  overflow-y: auto;
}
.vp-actions { padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--border); }
.vp-actions button {
  width: 100%;
  background: var(--accent);
  color: #fff;
  padding: 8px;
  border-radius: var(--r-sm);
  font-size: 13px;
}
.vp-actions button:disabled { opacity: 0.4; cursor: not-allowed; }

/* ═══════════════ Command palette ═══════════════ */
#palette-overlay {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.45);
  z-index: 500;
  display: none;
  justify-content: center;
  padding-top: 12vh;
}
#palette-overlay.open { display: flex; }
#palette {
  width: 560px;
  max-width: calc(100vw - 32px);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-2);
  overflow: hidden;
  height: max-content;
  max-height: 70vh;
  display: flex;
  flex-direction: column;
}
#palette-input {
  border: none;
  border-bottom: 1px solid var(--border);
  border-radius: 0;
  background: transparent;
  padding: 14px 16px;
  font-size: 15px;
}
#palette-input:focus { background: transparent; }
#palette-results { overflow-y: auto; padding: 6px; flex: 1; }
.pal-section {
  font-size: 11.5px;
  color: var(--muted);
  padding: 10px 10px 4px;
  font-weight: 500;
}
.pal-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: var(--r-sm);
  cursor: pointer;
  font-size: 13.5px;
}
.pal-item:hover, .pal-item.active { background: var(--accent-dim); }
.pal-icon { flex-shrink: 0; width: 20px; text-align: center; }
.pal-hint { margin-left: auto; color: var(--muted); font-size: 11.5px; flex-shrink: 0; }
#palette-footer {
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 11.5px;
  padding: 8px 16px;
}

/* ═══════════════ Link preview / toast / FAB ═══════════════ */
#link-preview-card {
  position: fixed;
  display: none;
  width: 420px;
  max-width: calc(100vw - 16px);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-2);
  z-index: 800;
  font-size: 13px;
}
#link-preview-card.open { display: block; }
.lp-title { font-weight: 600; padding: 12px 16px 8px; cursor: pointer; }
.lp-title:hover { color: var(--accent); }
.lp-body {
  padding: 0 16px;
  max-height: 280px;
  overflow-y: auto;
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.7;
}
.lp-body > * { max-width: 100%; }
.lp-footer { color: var(--muted); font-size: 11.5px; padding: 10px 16px 12px; }
.lp-missing { color: var(--muted); padding: 0 16px 14px; cursor: pointer; }
.lp-missing:hover { color: var(--accent); }

#toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--card);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-2);
  padding: 10px 20px;
  border-radius: var(--r-md);
  font-size: 13px;
  display: none;
  z-index: 1000;
}
#toast.error { border-color: var(--overdue); color: var(--overdue); }

#fab-save { display: none; }
#hamburger { display: none; }
#mobile-preview-tab { display: none; }

/* ═══════════════ Mobile (≤ 768px) ═══════════════ */
@media (max-width: 768px) {
  body { flex-direction: column; }

  #header { padding: 8px 12px; gap: 6px; flex-wrap: wrap; }
  #hamburger {
    display: flex;
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: var(--r-sm);
    font-size: 17px;
    align-items: center;
    justify-content: center;
  }
  #hamburger:active { background: var(--hover); }
  #header #search-input { flex: 1 1 100%; order: 1; min-width: 0; }
  #header > button:not(#hamburger) { flex-shrink: 0; }
  #search-btn, #new-btn { padding: 6px 10px; font-size: 12px; order: 2; }
  #theme-toggle { order: 2; padding: 6px 8px; font-size: 14px; }

  /* Editing: top bar collapses to hamburger only */
  #header.compact { padding: 8px 12px; gap: 8px; flex-wrap: nowrap; }
  #header.compact #search-input,
  #header.compact #search-btn,
  #header.compact #new-btn,
  #header.compact #theme-toggle { display: none; }
  #header.compact #hamburger { padding: 8px 14px; }

  /* Sidebar drawer */
  #sidebar {
    position: fixed;
    top: 0; left: 0;
    width: 280px;
    height: 100vh;
    z-index: 600;
    transform: translateX(-100%);
    transition: transform 0.25s var(--ease);
    box-shadow: var(--shadow-2);
  }
  #sidebar.open { transform: translateX(0); }
  #sidebar.narrow { width: 280px; }
  #sidebar.narrow #sidebar-header a,
  #sidebar.narrow #tags-section,
  #sidebar.narrow .nav-text { display: flex; }
  #sidebar.narrow .nav-item { justify-content: flex-start; padding: 8px 14px; margin: 1px 8px; font-size: 14px; }
  #sidebar.narrow #sidebar-settings-btn { text-align: left; font-size: 13px; padding: 7px 14px; }
  #sidebar-scrim {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 599;
  }
  #sidebar-scrim.open { display: block; }

  /* Editor: single column with preview tab */
  #editor-layout { flex-direction: column; }
  #editor-header { padding: 8px 12px; gap: 6px; }
  #page-name { min-width: 0; }
  #editor-pane { width: 100% !important; flex: 1; }
  #divider { display: none; }
  #preview-pane { display: none; flex: 1; padding: 12px 16px; min-width: 0; }
  #editor.preview-active #editor-pane { display: contents; }
  #editor.preview-active #editor-header,
  #editor.preview-active .CodeMirror { display: none; }
  #editor.preview-active #preview-pane { display: block; order: -1; }
  #editor-footer { padding: 6px 12px; gap: 6px; flex-wrap: wrap; }
  #editor-footer .hint { display: none; }
  #mobile-preview-tab {
    display: flex;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--accent);
    padding: 6px 14px;
    border-radius: var(--r-sm);
    font-size: 13px;
    align-items: center;
    gap: 4px;
  }
  #editor.preview-active #mobile-preview-tab { background: var(--accent); color: #fff; }
  #fab-save {
    display: flex;
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 400;
    border-radius: 28px;
    padding: 14px 24px;
    font-size: 15px;
    box-shadow: var(--shadow-2);
    align-items: center;
    gap: 6px;
  }
  #fab-save:active { filter: brightness(0.9); }

  /* Panels: bottom sheets */
  #palette {
    width: 100%;
    max-width: 100%;
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    position: absolute;
    bottom: 0;
  }
  #palette-overlay { align-items: flex-end; padding-top: 0; }
  #palette-results { max-height: 56vh; }
  #version-panel {
    top: auto;
    bottom: -100%;
    right: 0;
    left: 0;
    width: 100%;
    height: 70vh;
    border-left: none;
    border-top: 1px solid var(--border);
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    transition: bottom 0.25s var(--ease);
    transform: none;
  }
  #version-panel.open { bottom: 0; }
  #version-panel .vp-preview { max-height: 36vh; }
  #settings-panel .panel {
    width: 100%;
    max-width: 100%;
    height: 100%;
    max-height: none;
    border-radius: 0;
    display: flex;
    flex-direction: column;
  }
  #settings-panel .panel > *:nth-child(n+3) { flex: 1; min-height: 0; }
  #setting-custom-css { height: auto; flex: 1; min-height: 80px; }
  #link-preview-card {
    width: 100%;
    max-width: 100%;
    left: 0 !important;
    top: auto !important;
    bottom: -300px;
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    transition: bottom 0.25s var(--ease);
    padding: 16px 20px;
    font-size: 14px;
  }
  #link-preview-card.open { bottom: 0; display: block; }
  #link-preview-card .lp-body { max-height: 40vh; }

  /* Dense views */
  #content { padding: 16px 12px 96px; }
  #page-view h1 { font-size: 24px; }
  #todo-header { gap: 8px; }
  #gantt-view-modes { margin-left: 0; width: 100%; order: 3; }
  #graph-stats { font-size: 12px; }

  /* Bottom sheets for editor popovers */
  #slash-menu, #ref-autocomplete {
    bottom: 0;
    top: auto !important;
    left: 0 !important;
    right: 0;
    width: 100%;
    max-width: 100%;
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    max-height: 50vh;
  }

  /* Touch: no hover, active states instead; bigger targets */
  .nav-item:hover, .tag-item:hover, .pal-item:hover,
  .ref-item:hover, .slash-item:hover, .backlink-item:hover,
  .page-list-item:hover { background: none; }
  .nav-item:active, .tag-item:active, .pal-item:active,
  .ref-item:active, .slash-item:active, .backlink-item:active,
  .page-list-item:active { background: var(--hover); }
  .nav-item { padding: 10px 14px; min-height: 44px; }
  .tag-item { padding: 6px 14px; min-height: 36px; }
  .pal-item { padding: 12px 14px; min-height: 44px; }
  .ref-item, .slash-item { padding: 12px 14px; min-height: 44px; }
  .todo-list-item { padding: 12px 8px; min-height: 48px; }
  .todo-stat { padding: 6px 12px; min-height: 36px; }
  .page-list-item { padding: 12px 4px; min-height: 48px; }
  .backlink-item { padding: 10px 14px; min-height: 44px; }
}

<body>
<!-- Sidebar scrim overlay (mobile) -->
<div id="sidebar-scrim"></div>
<!-- Sidebar -->
<div id="sidebar">
  <div id="sidebar-header">
    <a href="/" class="nav-text">📚 KB</a>
    <button id="sidebar-toggle" title="收起侧边栏">◀</button>
  </div>

<script>
// ── URL routing: base detection + route helpers ─────────────
// Supports subdomain (base='') and path-prefix (base='/kb') deployments.
// nginx must pass prefix through WITHOUT stripping:
//   location /kb/ { proxy_pass http://kb:8080; }  // no trailing slash
function detectBase() {
  const p = location.pathname;
  const m = p.match(/^(.*?)(?:\/(page|all|graph|todo|journal|tag|edit|new)(?:\/|$))/);
  if (m) return m[1] || '';
  // No known route suffix: whole path is the base root
  if (p === '/' || p === '') return '';
  return p.replace(/\/+$/, '');
}
const BASE = detectBase();
const API = BASE + '/api';

function routeToUrl(target, args = []) {
  switch (target) {
    case 'all': return BASE + '/all';
    case 'graph': return BASE + '/graph';
    case 'todo': return BASE + '/todo';
    case 'journal': return BASE + '/journal' + (args[0] ? '/' + args[0] : '');
    case 'page': return BASE + '/page/' + encodeURIComponent(args[0] || '');
    case 'tag': return BASE + '/tag/' + encodeURIComponent(args[0] || '');
    case 'edit': return BASE + '/edit/' + encodeURIComponent(args[0] || '');
    case 'new': return BASE + '/new';
    default: return BASE + '/';
  }
}

function parseUrl(path) {
  // Strip base prefix, then match route
  let p = path;
  if (BASE && p.startsWith(BASE)) p = p.slice(BASE.length);
  p = p.replace(/^\/+/, '');
  if (!p) return { target: 'home', args: [] };
  const parts = p.split('/');
  const rest = parts.slice(1).map(decodeURIComponent).join('/');
  switch (parts[0]) {
    case 'all': return { target: 'all', args: [] };
    case 'graph': return { target: 'graph', args: [] };
    case 'todo': return { target: 'todo', args: [] };
    case 'journal': return { target: 'journal', args: rest ? [rest] : [] };
    case 'page': return { target: 'page', args: rest ? [rest] : [] };
    case 'tag': return { target: 'tag', args: rest ? [rest] : [] };
    case 'edit': return { target: 'edit', args: rest ? [rest] : [] };
    case 'new': return { target: 'new', args: [] };
    default: return { target: 'home', args: [] };
  }
}

let suppressPush = false;

function pushRoute(target, args = []) {
  if (suppressPush) return;
  history.pushState({ target, args }, '', routeToUrl(target, args));
}

function navigateFromUrl() {
  const { target, args } = parseUrl(location.pathname);
  suppressPush = true;
  try {
    navigate(target, ...args);
  } finally {
    suppressPush = false;
  }
}

window.addEventListener('popstate', navigateFromUrl);

// ── View data cache (60s TTL, invalidated on writes) ──────────

const CACHE_TTL = 60 * 1000;
const viewCache = {};

async function cachedFetch(key, url) {
  const hit = viewCache[key];
  if (hit && Date.now() - hit.ts < CACHE_TTL) return hit.data;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data = await resp.json();
  viewCache[key] = { data, ts: Date.now() };
  return data;
}

function invalidateCache() {
  Object.keys(viewCache).forEach(k => delete viewCache[k]);
  tagCache = null;       // tag autocomplete
  allPages = [];         // ref autocomplete
  allNames = null;       // unresolved-link detection
  if (typeof lpCache !== 'undefined') lpCache.clear();  // hover preview
}
let currentName = null;   // page currently being edited
let cm = null;
let md = window.markdownit({
  html: false,
  linkify: true,
  typographer: true,
  breaks: true,
});
let allPages = [];   // cache for reference autocomplete (up to 200)
let allNames = null; // full name set for unresolved-link detection

// ── markdown-it: wiki-link rendering ────────────────────────────

const defaultLinkRender = md.renderer.rules.link_open || function(tokens, idx, options, env, self) {
  return self.renderToken(tokens, idx, options);
};

// Custom wiki-link inline rule: [[target]] or [[target|alias]]
// Embed transclusion: ![[target]] renders the target page's content in place.
// Emits a placeholder div; content is fetched and filled asynchronously by
// fillEmbeds() (depth-limited to break reference cycles).
// NOTE: registered after the wikilink rule exists, but placed before it so
// `![[x]]` is matched here first (otherwise wikilink swallows the `[[x]]` part).
function kbEmbedRule(state, silent) {
  const start = state.pos;
  if (state.src.slice(start, start + 3) !== '![[') return false;
  const end = state.src.indexOf(']]', start + 3);
  if (end === -1) return false;
  if (!silent) {
    const name = state.src.slice(start + 3, end).split('|')[0].trim();
    const token = state.push('kb_embed', '', 0);
    token.meta = { name };
  }
  state.pos = end + 2;
  return true;
}

md.inline.ruler.before('link', 'wikilink', function(state, silent) {
  const start = state.pos;
  if (state.src.slice(start, start + 2) !== '[[') return false;
  const end = state.src.indexOf(']]', start + 2);
  if (end === -1) return false;

  if (!silent) {
    const inner = state.src.slice(start + 2, end);
    const parts = inner.split('|');
    const name = parts[0].trim();
    const display = parts.length > 1 ? parts.slice(1).join('|').trim() : name;

    const token = state.push('link_open', 'a', 1);
    token.attrSet('href', 'wiki:' + name);
    token.attrSet('class', 'wikilink');
    const textToken = state.push('text', '', 0);
    textToken.content = display;
    state.push('link_close', 'a', -1);
  }
  state.pos = end + 2;
  return true;
});

md.renderer.rules.link_open = function(tokens, idx, options, env, self) {
  const href = tokens[idx].attrGet('href') || '';
  if (href.startsWith('wiki:')) {
    const name = href.slice(5);
    tokens[idx].attrSet('href', '#');
    tokens[idx].attrSet('data-page', name);
    tokens[idx].attrSet('class', 'wikilink');
  }
  return defaultLinkRender(tokens, idx, options, env, self);
};

// mermaid fence: emit .mermaid div with escaped source; the actual render
// happens on demand in renderMermaidBlocks() (library lazy-loaded from CDN).
const defaultFence = md.renderer.rules.fence || function(tokens, idx, options, env, self) {
  return self.renderToken(tokens, idx, options);
};
md.renderer.rules.fence = function(tokens, idx, options, env, self) {
  const token = tokens[idx];
  const lang = (token.info || '').trim().split(/\s+/)[0];
  if (lang === 'mermaid') {
    return `<div class="mermaid">${escapeHtml(token.content)}</div>\n`;
  }
  return defaultFence(tokens, idx, options, env, self);
};

// kbembed rule registration: 'wikilink' must already exist when this runs —
// ruler.before() throws on unknown names and kills the whole script.
md.inline.ruler.before('wikilink', 'kbembed', kbEmbedRule);
md.renderer.rules.kb_embed = function(tokens, idx) {
  return `<div class="kb-embed" data-embed="${escapeHtml(tokens[idx].meta.name)}"></div>\n`;
};

// ── Global click delegation (data-page / data-tag) ──────────────

document.addEventListener('click', (e) => {
  const pageEl = e.target.closest('[data-page]');
  if (pageEl) { e.preventDefault(); navigate('page', pageEl.dataset.page); return; }
  const tagEl = e.target.closest('[data-tag]');
  if (tagEl) { navigate('tag', tagEl.dataset.tag); return; }
  const createEl = e.target.closest('[data-create]');
  if (createEl) {
    e.preventDefault();
    newPage();
    document.getElementById('page-name').value = createEl.dataset.create;
    if (cm) cm.focus();
    return;
  }
  const navEl = e.target.closest('[data-nav]');
  if (navEl) { navigate(navEl.dataset.nav); }
});

// ── Keyboard list navigation (j/k + Enter, desktop only) ────────
let knavIdx = -1;

function knavItems() {
  return [...document.querySelectorAll('#home-view .page-list-item, #page-view .backlink-item')]
    .filter(el => el.offsetParent !== null); // skip items in hidden views
}

function knavClear() {
  document.querySelectorAll('.knav-active').forEach(el => el.classList.remove('knav-active'));
  knavIdx = -1;
}

function knavMove(dir) {
  const items = knavItems();
  if (!items.length) return;
  const next = Math.min(items.length - 1, Math.max(0, knavIdx + dir));
  knavClear(); // resets knavIdx to -1 — restore after
  knavIdx = next;
  items[knavIdx].classList.add('knav-active');
  items[knavIdx].scrollIntoView({ block: 'nearest' });
}

document.addEventListener('keydown', (e) => {
  if (isMobile() || e.isComposing || e.ctrlKey || e.metaKey || e.altKey) return;
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT' || ae.isContentEditable)) return;
  if (document.querySelector('.CodeMirror-focused')) return;
  if (e.key === 'j') { e.preventDefault(); knavMove(1); }
  else if (e.key === 'k') { e.preventDefault(); knavMove(-1); }
  else if (e.key === 'Enter') {
    const active = knavItems().find(el => el.classList.contains('knav-active'));
    if (active && active.dataset.page) { e.preventDefault(); navigate('page', active.dataset.page); }
  } else if (e.key === 'Escape') knavClear();
});

// ── Navigation ─────────────────────────────────────────────────

function navigate(target, ...args) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (target === 'home') {
    pushRoute('home');
    showHome();
    document.querySelectorAll('.nav-item')[0].classList.add('active');
  } else if (target === 'all') {
    pushRoute('all');
    showAllPages();
    document.querySelectorAll('.nav-item')[1].classList.add('active');
  } else if (target === 'journal') {
    pushRoute('journal', args[0]);
    showJournal(args[0]);
    document.querySelectorAll('.nav-item')[2].classList.add('active');
  } else if (target === 'graph') {
    pushRoute('graph');
    showGraph();
    document.querySelectorAll('.nav-item')[3].classList.add('active');
  } else if (target === 'todo') {
    pushRoute('todo');
    showTodo();
    document.querySelectorAll('.nav-item')[4].classList.add('active');
  } else if (target === 'page') {
    pushRoute('page', args[0]);
    loadPage(args[0]);
  } else if (target === 'tag') {
    pushRoute('tag', args[0]);
    showTagPages(args[0]);
  } else if (target === 'edit') {
    // editPage() pushes its own route
    loadAndEdit(args[0]);
  } else if (target === 'new') {
    // newPage() pushes its own route
    newPage();
  }
}

async function loadAndEdit(name) {
  try {
    const resp = await fetch(`${API}/pages/${encodeURIComponent(name)}`);
    if (!resp.ok) { showToast('页面不存在: ' + name, 'error'); navigate('home'); return; }
    editPage(await resp.json());
  } catch (e) {
    showToast('加载失败: ' + e.message, 'error');
  }
}

// ── Home ───────────────────────────────────────────────────────

async function showHome() {
  hideAll();
  document.getElementById('home-view').style.display = 'block';
  const [pages, tags] = await Promise.all([
    cachedFetch('homePages', `${API}/pages?limit=50`),
    cachedFetch('tags', `${API}/tags`),
  ]);

  // Dashboard: a designated page rendered on top of the home view.
  let dash = null;
  if (getDashboardPage()) {
    try {
      dash = await cachedFetch(`page:${getDashboardPage()}`, `${API}/pages/${encodeURIComponent(getDashboardPage())}`);
    } catch (e) { /* dashboard disabled or missing — fall through */ }
  }

  let html = '';
  if (dash) {
    html += `<div class="list-col dashboard">
      <div class="dashboard-toolbar">
        <button class="btn-imp" onclick="editDashboard()">✏️ 编辑看板</button>
      </div>
      <div id="dashboard-content">${renderContent(dash.content)}</div>
    </div>`;
  }

  if (pages.length === 0 && !dash) {
    html += '<div class="empty-hint">还没有页面。<br>点击右上角「+ 新页面」写下第一篇，或按 Ctrl+K 打开命令面板。</div>';
  } else {
    html += '<div class="list-col">';
    if (dash) html += '<div class="time-group">最近页面</div>';
    let lastGroup = dash ? 'skip-first' : '';
    for (const p of pages) {
      const g = timeGroupKey(p.updated_at);
      if (g !== lastGroup) {
        if (!dash || lastGroup !== 'skip-first') html += `<div class="time-group">${g}</div>`;
        else html += ''; // first group header already emitted above
        lastGroup = g;
      }
      html += `<div class="page-list-item" data-page="${escapeHtml(p.name)}">
        <div class="row"><span class="title">${escapeHtml(p.name)}</span><span class="meta">${relativeDate(p.updated_at)}</span></div>
      </div>`;
    }
    html += '</div>';
  }
  document.getElementById('home-view').innerHTML = html;
  loadTags(tags);

  if (dash) {
    const dc = document.getElementById('dashboard-content');
    fillEmbeds(dc);
    markUnresolved(dc);
    renderMermaidBlocks(dc);
  }
}

function getDashboardPage() {
  const v = localStorage.getItem('kb-dashboard-page');
  return v === '' ? null : (v || 'KB-看板');
}

async function editDashboard() {
  const name = getDashboardPage();
  if (!name) return;
  try {
    const resp = await fetch(`${API}/pages/${encodeURIComponent(name)}`);
    if (resp.ok) { editPage(await resp.json()); return; }
  } catch (e) { /* fall through to create */ }
  newPage();
  document.getElementById('page-name').value = name;
  if (cm) cm.focus();
}

// ── All Pages ─────────────────────────────────────────────────

async function showAllPages() {
  hideAll();
  const view = document.getElementById('home-view');
  view.style.display = 'block';
  view.innerHTML = '<div style="padding:20px;color:var(--muted)">加载中...</div>';

  let pages;
  try {
    pages = await cachedFetch('allPages', `${API}/pages?limit=500`);
  } catch (e) {
    pages = [];
  }

  // Fast sort: pre-compute lowercase names, use simple comparison
  pages.sort((a, b) => {
    const x = a.name.toLowerCase();
    const y = b.name.toLowerCase();
    return x < y ? -1 : x > y ? 1 : 0;
  });

  const frag = document.createDocumentFragment();

  const header = document.createElement('div');
  header.className = 'list-col';
  header.innerHTML = `<div class="toolbar">
    <div class="view-title">所有页面 <span class="count">${pages.length}</span></div>
    <span class="spacer"></span>
    <button class="btn-imp" onclick="document.getElementById('import-file-input').click()" title="导入 .md 或 .zip">📥 导入</button>
    <button class="btn-imp" onclick="exportPages('zip')" title="导出为 zip（Markdown + front matter）">📤 导出</button>
  </div>

async function handleImportFiles(files) {
  if (!files || files.length === 0) return;

  const uploads = [...files].filter(f => /\.(md|zip)$/i.test(f.name));
  if (uploads.length === 0) {
    showToast('只支持 .md 或 .zip 文件');
    return;
  }

  const strategy = confirm(
    `导入 ${uploads.length} 个文件\n\n「确定」= 跳过已存在的同名页面\n「取消」= 覆盖已存在的同名页面`
  ) ? 'skip' : 'overwrite';

  let created = 0, skipped = 0, overwritten = 0;
  for (const f of uploads) {
    const fd = new FormData();
    fd.append('file', f);
    fd.append('conflict', strategy);
    try {
      const resp = await fetch('/api/import', { method: 'POST', body: fd });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        showToast(`导入失败: ${err.detail || resp.status}`);
        return;
      }
      const r = await resp.json();
      created += r.created; skipped += r.skipped; overwritten += r.overwritten;
    } catch (e) {
      showToast(`导入失败: ${e.message}`);
      return;
    }
  }
  showToast(`导入完成: 新建 ${created}, 跳过 ${skipped}, 覆盖 ${overwritten}`);
  invalidateCache();
  const nav = document.querySelector('.nav-item[data-nav="all"]');
  if (nav) nav.click();
}

async function computeHealth() {
  const [graph, allPages] = await Promise.all([
    cachedFetch('graph', `${API}/graph`),
    cachedFetch('allPages', `${API}/pages?limit=500`),
  ]);
  const nodeSet = new Set(graph.nodes.map(n => n.name.toLowerCase()));
  const updatedMap = {};
  for (const p of allPages) updatedMap[p.name.toLowerCase()] = p.updated_at;
  const inbound = {};
  for (const e of graph.edges) {
    if (e.source.toLowerCase() === e.target.toLowerCase()) continue; // self-links don't rescue an orphan
    inbound[e.target.toLowerCase()] = (inbound[e.target.toLowerCase()] || 0) + 1;
  }
  const orphans = graph.nodes
    .filter(n => !inbound[n.name.toLowerCase()])
    .map(n => ({ name: n.name, updated_at: updatedMap[n.name.toLowerCase()] || '' }))
    .sort((a, b) => (a.updated_at < b.updated_at ? -1 : 1)); // stalest islands first
  const brokenMap = {};
  for (const e of graph.edges) {
    if (nodeSet.has(e.target.toLowerCase())) continue;
    const k = e.target.toLowerCase();
    (brokenMap[k] = brokenMap[k] || { target: e.target, sources: [] }).sources.push(e.source);
  }
  const broken = Object.values(brokenMap).sort((a, b) => b.sources.length - a.sources.length);
  return { orphans, broken };
}

    h = await computeHealth();
  } catch (e) {
    list.innerHTML = `<div class="empty-hint">体检失败: ${escapeHtml(e.message)}</div>`;
    return;
  }
  let html = `<div class="time-group">🪺 孤立页（${h.orphans.length}）—— 没有任何页面链接到它们</div>`;
  if (!h.orphans.length) {
    html += '<div class="health-item src">无 —— 没有孤岛</div>';
  } else {
    for (const o of h.orphans) {
      html += `<div class="page-list-item" data-page="${escapeHtml(o.name)}">
        <div class="row"><span class="title">${escapeHtml(o.name)}</span><span class="meta">${o.updated_at ? relativeDate(o.updated_at) : ''}</span></div>
      </div>`;
    }
  }
  html += `<div class="time-group">🔗 断链（${h.broken.length}）—— 指向不存在的页面</div>`;
  if (!h.broken.length) {
    html += '<div class="health-item src">无 —— 所有链接都有落点</div>';
  } else {
    for (const b of h.broken) {
      const srcs = [...new Set(b.sources)].map(src =>
        `<a href="#" data-page="${escapeHtml(src)}">${escapeHtml(src)}</a>`).join('、');
      html += `<div class="health-item">
        <div class="row">
          <span class="title">${escapeHtml(b.target)}</span>
          <button class="restore-btn" data-create="${escapeHtml(b.target)}">创建此页</button>
        </div>
        <div class="src">被引用 ${b.sources.length} 次 ← ${srcs}</div>
      </div>`;
    }
  }
  list.innerHTML = html;
}

let currentSaveMode = 'page'; // 'page' | 'journal'
let journalDate = '';

function initCM(textareaEl, opts) {
  opts = opts || {};
  const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
  const cmTheme = currentTheme === 'dark' ? 'dracula' : 'default';
  cm = CodeMirror.fromTextArea(textareaEl, {
    mode: 'markdown',
    theme: cmTheme,
    lineNumbers: true,
    lineWrapping: true,
    matchBrackets: true,
    autoCloseBrackets: false,
    styleActiveLine: true,
    extraKeys: {
      'Ctrl-S': () => currentSaveMode === 'journal' ? saveJournal() : savePage(),
      'Cmd-S': () => currentSaveMode === 'journal' ? saveJournal() : savePage(),
      'Ctrl-B': (cm) => wrapSelection(cm, '**', '**'),
      'Cmd-B': (cm) => wrapSelection(cm, '**', '**'),
      'Ctrl-I': (cm) => wrapSelection(cm, '*', '*'),
      'Cmd-I': (cm) => wrapSelection(cm, '*', '*'),
      'Enter': (cm) => {
        // If ref/tag autocomplete is open, select the active item
        const refMenu = document.getElementById('ref-autocomplete');
        if (refMenu.style.display !== 'none') {
          if (insertActiveRefOrTag()) return;
        }
        const cursor = cm.getCursor();
        const line = cm.getLine(cursor.line);
        const beforeCursor = line.slice(0, cursor.ch);
        const slashMatch = beforeCursor.match(/\/(\w*)$/);
        if (slashMatch && cursor.ch - slashMatch[0].length === line.indexOf(slashMatch[0])) {
          showSlashMenu(slashMatch[1], cursor);
          return;
        }
        const refMatch = beforeCursor.match(/\[\[([^\]]*)$/);
        if (refMatch) {
          showRefAutocomplete(refMatch[1], cursor);
          return;
        }
        cm.replaceRange('\n', cursor);
      },
      'Esc': () => {
        hideSlashMenu();
        hideRefAutocomplete();
      },
      'Tab': (cm) => {
        const refMenu = document.getElementById('ref-autocomplete');
        if (refMenu.style.display !== 'none') {
          if (insertActiveRefOrTag()) return;
        }
        cm.replaceRange('  ', cm.getCursor());
      },
      'Up': (cm) => {
        const refMenu = document.getElementById('ref-autocomplete');
        if (refMenu.style.display !== 'none') {
          navigateRefItems(-1);
          return;
        }
        return CodeMirror.Pass;
      },
      'Down': (cm) => {
        const refMenu = document.getElementById('ref-autocomplete');
        if (refMenu.style.display !== 'none') {
          navigateRefItems(1);
          return;
        }
        return CodeMirror.Pass;
      },
    },
  });

  cm.on('change', () => {
    updatePreview();
    const cursor = cm.getCursor();
    const line = cm.getLine(cursor.line);
    const beforeCursor = line.slice(0, cursor.ch);
    const refMatch = beforeCursor.match(/\[\[([^\]]*)$/);
    const tagMatch = beforeCursor.match(TAG_TRIGGER_RE);
    if (refMatch) {
      showRefAutocomplete(refMatch[1], cursor);
    } else if (tagMatch) {
      showTagAutocomplete(tagMatch[2], cursor);
    } else {
      hideRefAutocomplete();
    }
  });

  cm.on('cursorActivity', () => {
    hideSlashMenu();
    // Don't hide ref autocomplete here - it's managed by change event
  });

  // Scroll sync: editor -> preview
  let isSyncing = false;
  const previewEl = document.getElementById('preview-pane');
  const scrollSyncToggle = document.getElementById('scroll-sync');

  cm.on('scroll', () => {
    if (isSyncing) return;
    if (!scrollSyncToggle || !scrollSyncToggle.checked) return;
    isSyncing = true;
    const scrollInfo = cm.getScrollInfo();
    const pct = scrollInfo.height > scrollInfo.clientHeight
      ? scrollInfo.top / (scrollInfo.height - scrollInfo.clientHeight)
      : 0;
    const previewMax = previewEl.scrollHeight - previewEl.clientHeight;
    previewEl.scrollTop = pct * previewMax;
    requestAnimationFrame(() => { isSyncing = false; });
  });

  // Draggable divider
  const divider = document.getElementById('divider');
  const editorPane = document.getElementById('editor-pane');
  const layout = document.getElementById('editor-layout');
  let startX = 0, startWidth = 0;

  divider.addEventListener('mousedown', (e) => {
    if (window.innerWidth <= 768) return; // disabled on mobile
    e.preventDefault();
    divider.classList.add('dragging');
    startX = e.clientX;
    startWidth = editorPane.offsetWidth;
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
  });

  function onMouseMove(e) {
    const dx = e.clientX - startX;
    const layoutWidth = layout.offsetWidth;
    let newWidth = ((startWidth + dx) / layoutWidth) * 100;
    newWidth = Math.max(20, Math.min(80, newWidth));
    editorPane.style.width = newWidth + '%';
    cm.refresh();
  }

  function onMouseUp() {
    divider.classList.remove('dragging');
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onMouseUp);
    cm.refresh();
  }
}

function wrapSelection(cm, before, after) {
  const sel = cm.getSelection();
  if (sel) {
    cm.replaceSelection(before + sel + after);
  } else {
    const cur = cm.getCursor();
    cm.replaceRange(before + after, cur);
    cm.setCursor({ line: cur.line, ch: cur.ch + before.length });
  }
  cm.focus();
}

function updatePreview() {
  if (!cm) return;
  document.getElementById('preview-pane').innerHTML = renderContent(cm.getValue());
  // mermaid renders are expensive — debounce while typing
  clearTimeout(updatePreview._mmd);
  updatePreview._mmd = setTimeout(() => renderMermaidBlocks(document.getElementById('preview-pane')), 300);
}

function renderContent(content) {

// ── Draft autosave (localStorage, every 30s + beforeunload) ──────
// Keyed by page name (lowercased; '__new__' for untitled). Only written
// when content differs from what was loaded (draftBase), so merely
// opening a page never creates a draft. Cleared on successful save/delete.

let draftBase = '';

function draftKey() {
  if (currentSaveMode === 'journal') return 'kb-draft:journal';
  const name = document.getElementById('page-name')?.value.trim().toLowerCase();
  return 'kb-draft:page:' + (name || '__new__');
}

function draftSave() {
  if (!cm || document.getElementById('editor').style.display !== 'block') return;
  const content = cm.getValue();
  if (!content.trim() || content === draftBase) return;
  const name = currentSaveMode === 'journal'
    ? journalDate
    : document.getElementById('page-name').value.trim();
  try {
    localStorage.setItem(draftKey(), JSON.stringify({ name, content, ts: Date.now() }));
  } catch (e) { /* storage full — drop silently */ }
}

function _draftMinutes(ts) { return Math.max(1, Math.round((Date.now() - ts) / 60000)); }

function checkDraft(base, keyOverride) {
  const bar = document.getElementById('draft-bar');
  let draft = null;
  try { draft = JSON.parse(localStorage.getItem(keyOverride || draftKey()) || 'null'); } catch (e) {}
  if (!draft || draft.content === base) {
    bar.style.display = 'none';
    return;
  }
  bar._draft = draft;
  const label = currentSaveMode === 'journal'
    ? `📝 ${draft.name} 的日记草稿（${_draftMinutes(draft.ts)} 分钟前未保存）`
    : `📝 「${draft.name || '未命名'}」的草稿（${_draftMinutes(draft.ts)} 分钟前未保存）`;
  document.getElementById('draft-msg').textContent = label;
  bar.style.display = 'flex';
}

function draftRestore() {
  const bar = document.getElementById('draft-bar');
  const draft = bar._draft;
  if (!draft) return;
  if (currentSaveMode === 'journal') {
    if (draft.name && draft.name !== journalDate) {
      journalDate = draft.name;
      const di = document.getElementById('journal-date-input');
      if (di) di.value = journalDate;
    }
  } else if (draft.name) {
    document.getElementById('page-name').value = draft.name;
  }
  cm.setValue(draft.content);
  draftBase = draft.content;
  updatePreview();
  bar.style.display = 'none';
  showToast('已恢复草稿（记得保存）');
}

function draftDiscard() {
  localStorage.removeItem(draftKey());
  document.getElementById('draft-bar').style.display = 'none';
}

setInterval(draftSave, 30000);
window.addEventListener('beforeunload', draftSave);

async function savePage() {
  const name = document.getElementById('page-name').value.trim();
  const content = cm.getValue();

  if (!name) {
    showToast('页面名不能为空', 'error');
    return;
  }

  const data = { name, content };
  let resp;
  if (currentName && currentName.toLowerCase() === name.toLowerCase()) {
    resp = await fetch(`${API}/pages/${encodeURIComponent(name)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content }),
    });
  } else if (currentName) {
    // rename: update the existing page with the new name
    resp = await fetch(`${API}/pages/${encodeURIComponent(currentName)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
  } else {
    resp = await fetch(`${API}/pages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
  }

  if (resp.ok) {
    invalidateCache();
    localStorage.removeItem(draftKey());
    showToast('保存成功');
    navigate('page', name);
  } else {
    const err = await resp.json();
    showToast(err.detail || '保存失败', 'error');
  }
}

// ── Slash menu ────────────────────────────────────────────────

const slashCommands = [
  { name: '一级标题', key: 'h1', action: (cm) => insertPrefix(cm, '# ') },
  { name: '二级标题', key: 'h2', action: (cm) => insertPrefix(cm, '## ') },
  { name: '三级标题', key: 'h3', action: (cm) => insertPrefix(cm, '### ') },
  { name: '无序列表', key: 'ul', action: (cm) => insertPrefix(cm, '- ') },
  { name: '有序列表', key: 'ol', action: (cm) => insertPrefix(cm, '1. ') },
  { name: '待办 (TODO)', key: 'todo', action: (cm) => insertPrefix(cm, '- [ ] ') },
  { name: '待办 (Done)', key: 'done', action: (cm) => insertPrefix(cm, '- [x] ') },
  { name: '引用', key: 'quote', action: (cm) => insertPrefix(cm, '> ') },
  { name: '代码块', key: 'code', action: (cm) => insertBlock(cm, '```\n', '\n```') },
  { name: '行内代码', key: 'inline', action: (cm) => insertBlock(cm, '`', '`') },
  { name: '粗体', key: 'bold', action: (cm) => insertBlock(cm, '**', '**') },
  { name: '斜体', key: 'italic', action: (cm) => insertBlock(cm, '*', '*') },
  { name: '链接', key: 'link', action: (cm) => insertBlock(cm, '[', '](url)') },
  { name: '图表 (mermaid)', key: 'diagram', action: (cm) => insertBlock(cm, '```mermaid\ngraph TD\n    A[开始] --> B{判断}\n    B -->|是| C[结束]\n    B -->|否| A\n', '\n```') },
  { name: '分隔线', key: 'hr', action: (cm) => insertPrefix(cm, '\n---\n') },
];

function insertPrefix(cm, prefix) {
  const cursor = cm.getCursor();
  const line = cm.getLine(cursor.line);
  const slashStart = line.lastIndexOf('/');
  cm.replaceRange('', { line: cursor.line, ch: slashStart }, cursor);
  if (!line.startsWith(prefix.trim())) {
    cm.replaceRange(prefix, { line: cursor.line, ch: 0 });
  }
  cm.focus();
}

function insertBlock(cm, before, after) {
  const cursor = cm.getCursor();
  const line = cm.getLine(cursor.line);
  const slashStart = line.lastIndexOf('/');
  cm.replaceRange('', { line: cursor.line, ch: slashStart }, cursor);
  cm.replaceRange(before + after, cursor);
  cm.setCursor({ line: cursor.line, ch: cursor.ch + before.length });
  cm.focus();
}

function showSlashMenu(query, cursor) {
  const menu = document.getElementById('slash-menu');
  const filtered = slashCommands.filter(c => c.name.includes(query) || c.key.includes(query));
  if (filtered.length === 0) { hideSlashMenu(); return; }

  let html = '';
  filtered.forEach((c, i) => {
    html += `<div class="slash-item${i === 0 ? ' active' : ''}" data-slash="${c.key}">
      <span>${c.name}</span><span class="key">${c.key}</span>
    </div>`;
  });
  menu.innerHTML = html;
  menu.style.display = 'block';

  const coords = cm.cursorCoords(cursor, 'local');
  menu.style.left = (coords.left + 20) + 'px';
  menu.style.top = (coords.bottom + 20) + 'px';
}

function hideSlashMenu() {
  document.getElementById('slash-menu').style.display = 'none';
}

// Slash command clicks are handled via delegation
document.getElementById('slash-menu').addEventListener('click', (e) => {
  const item = e.target.closest('[data-slash]');
  if (!item) return;
  const cmd = slashCommands.find(c => c.key === item.dataset.slash);
  if (cmd) cmd.action(cm);
  hideSlashMenu();
  updatePreview();
});

// ── Reference autocomplete ─────────────────────────────────────

let savedRefCursor = null; // cursor captured at autocomplete open time
let isInsertingRef = false; // guard: don't clear savedRefCursor during insert

async function showRefAutocomplete(query, cursor) {
  autocompleteMode = 'ref';
  savedRefCursor = { line: cursor.line, ch: cursor.ch };
  if (allPages.length === 0) {
    const resp = await fetch(`${API}/pages?limit=200`);
    allPages = await resp.json();
  }

  const q = query.toLowerCase();
  const filtered = allPages.filter(p => p.name.toLowerCase().includes(q)).slice(0, 8);

  const menu = document.getElementById('ref-autocomplete');
  if (filtered.length === 0) { hideRefAutocomplete(); return; }

  let html = '';
  filtered.forEach((p, i) => {
    html += `<div class="ref-item${i === 0 ? ' active' : ''}" data-ref="${escapeHtml(p.name)}">
      <div class="ref-title">${escapeHtml(p.name)}</div>
      <div class="ref-meta">${formatDate(p.updated_at)}</div>
    </div>`;
  });
  menu.innerHTML = html;
  menu.style.display = 'block';

  const coords = cm.cursorCoords(cursor, 'local');
  menu.style.left = (coords.left + 20) + 'px';
  menu.style.top = (coords.bottom + 20) + 'px';
}

function hideRefAutocomplete() {
  document.getElementById('ref-autocomplete').style.display = 'none';
  autocompleteMode = null;
  // Don't clear savedRefCursor if we're in the middle of an insert
  if (!isInsertingRef) savedRefCursor = null;
}

function navigateRefItems(dir) {
  const items = document.querySelectorAll('#ref-autocomplete .ref-item');
  if (items.length === 0) return;
  let idx = -1;
  items.forEach((el, i) => { if (el.classList.contains('active')) idx = i; });
  items.forEach(el => el.classList.remove('active'));
  idx = (idx + dir + items.length) % items.length;
  items[idx].classList.add('active');
  items[idx].scrollIntoView({ block: 'nearest' });
}

document.getElementById('ref-autocomplete').addEventListener('mousedown', (e) => {
  // Prevent focus loss from the editor when clicking menu items
  e.preventDefault();
});

document.getElementById('ref-autocomplete').addEventListener('click', (e) => {
  const item = e.target.closest('[data-ref]');
  if (!item) return;
  if (autocompleteMode === 'tag') {
    insertTag(item.dataset.ref);
  } else {
    insertRef(item.dataset.ref);
  }
});

function insertRef(name) {
  // Replace-entire-line approach: avoid cursor-range issues entirely.
  const cursor = cm.getCursor();
  const line = cm.getLine(cursor.line);
  const idx = line.lastIndexOf('[[');
  if (idx !== -1) {
    const closeIdx = line.indexOf(']]', idx + 2);
    const endPos = closeIdx === -1 ? line.length : closeIdx + 2;
    const newText = line.slice(0, idx) + '[[' + name + ']]' + line.slice(endPos);
    cm.replaceRange(newText, { line: cursor.line, ch: 0 }, { line: cursor.line, ch: line.length });
  } else {
    cm.replaceRange('[[' + name + ']]', cursor);
  }
  cm.focus();
  hideRefAutocomplete();
  updatePreview();
  savedRefCursor = null;
  isInsertingRef = false;
}

// ── Tag autocomplete (# prefix) ────────────────────────────────

let autocompleteMode = null;   // 'ref' | 'tag'
let tagCache = null;           // [{name, count}]

// Trigger pattern: # not preceded by another # (heading) or word char
const TAG_TRIGGER_RE = /(^|[^#\w])#([\w-]*)$/;

async function showTagAutocomplete(query, cursor) {
  autocompleteMode = 'tag';
  savedRefCursor = { line: cursor.line, ch: cursor.ch };

  if (!tagCache) {
    try {
      tagCache = await cachedFetch('tags', `${API}/tags`);
    } catch (e) { tagCache = []; }
  }

  const q = query.toLowerCase();
  const filtered = tagCache
    .filter(t => t.name.toLowerCase().includes(q))
    .sort((a, b) => b.count - a.count)
    .slice(0, 8);

  const menu = document.getElementById('ref-autocomplete');
  if (filtered.length === 0) { hideRefAutocomplete(); return; }

  let html = '';
  filtered.forEach((t, i) => {
    html += `<div class="ref-item${i === 0 ? ' active' : ''}" data-ref="${escapeHtml(t.name)}">
      <div class="ref-title">#${escapeHtml(t.name)}</div>
      <div class="ref-meta">${t.count} 个页面</div>
    </div>`;
  });
  menu.innerHTML = html;
  menu.style.display = 'block';

  const coords = cm.cursorCoords(cursor, 'local');
  menu.style.left = (coords.left + 20) + 'px';
  menu.style.top = (coords.bottom + 20) + 'px';
}

function insertTag(tag) {
  const cursor = cm.getCursor();
  const line = cm.getLine(cursor.line);
  const before = line.slice(0, cursor.ch);
  const m = before.match(TAG_TRIGGER_RE);
  if (m) {
    // Replace from the # to cursor with #tag + space
    const start = cursor.ch - m[2].length - 1;
    cm.replaceRange('#' + tag + ' ', { line: cursor.line, ch: start }, { line: cursor.line, ch: cursor.ch });
  } else {
    cm.replaceRange('#' + tag + ' ', cursor);
  }
  cm.focus();
  hideRefAutocomplete();
  updatePreview();
}

function insertActiveRefOrTag() {
  const refMenu = document.getElementById('ref-autocomplete');
  const active = refMenu.querySelector('.ref-item.active');
  if (!active) return false;
  if (autocompleteMode === 'tag') {
    insertTag(active.dataset.ref);
  } else {
    savedRefCursor = cm.getCursor();
    insertRef(active.dataset.ref);
  }
  return true;
}

// ── Search ─────────────────────────────────────────────────────

async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) { navigate('home'); return; }

  const match = q.match(/^\[\[(.+)\]\]$/);
  if (match) { navigate('page', match[1]); return; }

  hideAll();
  document.getElementById('home-view').style.display = 'block';
  const resp = await fetch(`${API}/pages?search=${encodeURIComponent(q)}&limit=100`);
  const pages = await resp.json();

  // Sort: exact name > starts with > contains name > content match
  const ql = q.toLowerCase();
  function score(p) {
    const nl = p.name.toLowerCase();
    if (nl === ql) return 0;
    if (nl.startsWith(ql)) return 1;
    if (nl.includes(ql)) return 2;
    return 3; // content match only
  }
  pages.sort((a, b) => score(a) - score(b) || a.name.localeCompare(b.name));

  let html = `<div class="list-col"><div class="view-title">搜索 "${escapeHtml(q)}" <span class="count">${pages.length}</span></div>`;
  if (pages.length === 0) {
    html += '<div class="empty-hint">没有匹配的结果。<br>换个关键词，或直接输入 [[页面名]] 直达。</div>';
  } else {
    for (const p of pages) {
      const nl = p.name.toLowerCase();
      let displayName = escapeHtml(p.name);
      // Highlight name match
      if (nl.includes(ql)) {
        const idx = nl.indexOf(ql);
        displayName = escapeHtml(p.name.slice(0, idx)) +
          '<mark style="background:var(--accent-dim);color:var(--accent);border-radius:2px">' +
          escapeHtml(p.name.slice(idx, idx + q.length)) + '</mark>' +
          escapeHtml(p.name.slice(idx + q.length));
      }
      html += `<div class="page-list-item" data-page="${escapeHtml(p.name)}">
        <div class="row"><span class="title">${displayName}</span><span class="meta">${relativeDate(p.updated_at)}</span></div>
      </div>`;
    }
  }
  html += '</div>';
  document.getElementById('home-view').innerHTML = html;
}

function parseTaskLine(line) {
  // Format: priority start-date [[links]] content due:end-date rec:cycle done:date
  const m = line.match(/^\s*(p[1-4]|\d)\s+(\d{4}-\d{2}-\d{2})\s+(.*?)(?:\s+due:(\d{4}-\d{2}-\d{2}))?(?:\s+(rec:\S+))?(?:\s+done:(\d{4}-\d{2}-\d{2}))?\s*$/i);
  if (!m) return null;
  let [, priority, startDate, middle, dueDate, rec, doneDate] = m;
  priority = priority.toLowerCase();
  if (priority === '1' || priority === '2' || priority === '3' || priority === '4') priority = 'p' + priority;

  // Extract [[links]] from middle
  const links = [];
  const linkRe = /\[\[([^\]]+)\]\]/g;
  let lm;
  while ((lm = linkRe.exec(middle)) !== null) {
    links.push(lm[1].split('|')[0].trim());
  }
  const title = middle.replace(linkRe, '').trim().replace(/\s+/g, ' ');
  if (!title) return null;

  return { priority, startDate, title, links, dueDate: dueDate || null, rec: rec || null, doneDate: doneDate || null, raw: line };
}

function parseTasks(content) {
  const tasks = [];
  const lines = content.split('\n');
  for (let i = 0; i < lines.length; i++) {
    const t = parseTaskLine(lines[i]);
    if (t) {
      t.lineIndex = i;
      tasks.push(t);
    }
  }
  return tasks;
}

function recalcRecurring(task, completionDate) {
  if (!task.rec) return null;
  const due = new Date(task.dueDate || task.startDate);
  const comp = new Date(completionDate);
  switch (task.rec) {
    case 'rec:1w':
      comp.setDate(comp.getDate() + 7);
      return comp.toISOString().slice(0, 10);
    case 'rec:+1m': {
      // Strict monthly: same day next month, with catch-up for overdue cycles
      let d = new Date(due);
      if (d < comp) {
        while (d < comp) d.setMonth(d.getMonth() + 1);
      } else {
        d.setMonth(d.getMonth() + 1);
      }
      return d.toISOString().slice(0, 10);
    }
    case 'rec:1b': {
      let d = new Date(comp);
      let added = 0;
      while (added < 1) {
        d.setDate(d.getDate() + 1);
        if (d.getDay() !== 0 && d.getDay() !== 6) added++;
      }
      return d.toISOString().slice(0, 10);
    }
    case 'rec:3b': {
      let d = new Date(comp);
      let added = 0;
      while (added < 3) {
        d.setDate(d.getDate() + 1);
        if (d.getDay() !== 0 && d.getDay() !== 6) added++;
      }
      return d.toISOString().slice(0, 10);
    }
    case 'rec:+1y': {
      // Strict yearly: same date next year, with catch-up
      let d = new Date(due);
      if (d < comp) {
        while (d < comp) d.setFullYear(d.getFullYear() + 1);
      } else {
        d.setFullYear(d.getFullYear() + 1);
      }
      return d.toISOString().slice(0, 10);
    }
    default:
      // rec:Nw, rec:Nd pattern
      const m = task.rec.match(/^rec:(\d+)(w|d)$/);
      if (m) {
        const n = parseInt(m[1]);
        const unit = m[2];
        let d = new Date(comp);
        if (unit === 'w') d.setDate(d.getDate() + n * 7);
        else d.setDate(d.getDate() + n);
        return d.toISOString().slice(0, 10);
      }
      return null;
  }
}

function switchTodoTab(tab) {
  document.getElementById('tab-list').classList.toggle('active', tab === 'list');
  document.getElementById('tab-gantt').classList.toggle('active', tab === 'gantt');
