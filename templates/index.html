<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KB</title>
<!--
  前端库全部 self-host（static/vendor/），无 CDN：连不上公网也要能用。
  部署前缀要在解析下面的资源 URL 之前确定，所以这里先算 base 再 document.write。
  应用侧只读 window.__KB_BASE__，不重复推导，两者永远不会不一致。
-->
<script>
(function () {
  var p = location.pathname;
  var m = p.match(/^(.*?)(?:\/(page|all|graph|todo|journal|tag|search|edit|new)(?:\/|$))/);
  var base = m ? (m[1] || '') : (p === '/' || p === '' ? '' : p.replace(/\/+$/, ''));
  window.__KB_BASE__ = base;
  var v = base + '/static/vendor/';
  document.write(
    '<link rel="manifest" href="' + base + '/manifest.webmanifest">' +
    '<link rel="icon" type="image/png" href="' + base + '/static/icons/icon-192.png">' +
    '<link rel="apple-touch-icon" href="' + base + '/static/icons/icon-192.png">' +
    '<meta name="theme-color" content="#1e1e2e">' +
    '<link rel="stylesheet" href="' + v + 'codemirror/codemirror.min.css">' +
    '<link rel="stylesheet" href="' + v + 'codemirror/dialog.css">' +
    '<link rel="stylesheet" href="' + v + 'codemirror/show-hint.css">' +
    '<script src="' + v + 'codemirror/codemirror.min.js"><\/script>' +
    '<script src="' + v + 'codemirror/markdown.min.js"><\/script>' +
    '<script src="' + v + 'codemirror/closebrackets.js"><\/script>' +
    '<script src="' + v + 'codemirror/matchbrackets.js"><\/script>' +
    '<script src="' + v + 'codemirror/active-line.js"><\/script>' +
    '<script src="' + v + 'codemirror/searchcursor.js"><\/script>' +
    '<script src="' + v + 'codemirror/search.js"><\/script>' +
    '<script src="' + v + 'codemirror/jump-to-line.js"><\/script>' +
    '<script src="' + v + 'codemirror/scrollpastend.js"><\/script>' +
    /* dialog.js 必须在 vim.js 之前：vim 的 / ? : 都靠 cm.openDialog
     * 弹底部单行输入框。此前只引了 dialog.css 没引这个脚本，
     * cm.openDialog 是 undefined → vim 退化成原生 prompt()。 */
    '<script src="' + v + 'codemirror/dialog.js"><\/script>' +
    '<script src="' + v + 'codemirror/show-hint.js"><\/script>' +
    '<script src="' + v + 'codemirror/vim.js"><\/script>' +
    '<script src="' + v + 'markdown-it.min.js"><\/script>'
  );
})();
</script>

<style>
/* ══════════════════════════════════════════════════════════════════
   设计基调：nvim / lazyvim。
   - 全屏内容，不做侧边栏，导航靠 : 命令行与 <space> 快捷键树
   - 顶部 tabline（buffer 列表），底部 statusline（mode/文件/位置/时间）
   - Catppuccin Mocha 深色 / Latte 浅色
   - 所有尺寸用 em/rem，等宽字体承担 UI 骨架
   ══════════════════════════════════════════════════════════════════ */

:root {
  --r-xs: 3px; --r-sm: 5px; --r-md: 8px;
  --mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Mono', ui-monospace, Menlo,
          Consolas, 'DejaVu Sans Mono', monospace;
  --ease: cubic-bezier(.2,.6,.3,1);
}

/* 主题来自 static/themes/*.css —— 由 static/themes/index.js 动态 <link> 进来。
 *
 * 模板里不留任何色值：加主题 = 加一个 CSS 文件 + 登记一行，
 * 切主题 = :colorscheme <名字>（等价 nvim）。:root 上的 data-scheme
 * 决定哪套变量生效，语义别名（--bg/--fg/--accent…）在主题文件里派生。
 *
 * 默认占位：主题文件还没加载完时用它，避免首屏闪白/闪黑。
 */

:root {
  --bg: #1e1e2e; --bg-deep: #181825; --bg-deepest: #11111b;
  --fg: #cdd6f4; --muted: #a6adc8; --faint: #9399b2;
  --line: #313244; --line-soft: #252536;
  /* 这三个原来被引用、却从未定义（卡片背景是透明的、插件 hover 没反馈）。
     这里是首帧回退值，具体配色由 static/themes/*.css 覆盖。 */
  --bg-mantle: #181825; --bg-hover: rgba(205,214,244,.06); --accent-soft: rgba(137,180,250,.14);
  --accent: #89b4fa; --accent2: #cba6f7; --link: #89dceb;
  --ok: #a6e3a1; --warn: #f9e2af; --err: #f38ba8;
  --p1bg: #f38ba8; --p2bg: #fab387; --p3bg: #f9e2af;
  --on-accent: #11111b; --on-solid: #11111b;
  --sel: rgba(137,180,250,.14);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 14px;
  line-height: 1.55;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

/* ── 滚动条：细、低调，与配色一致 ───────────────────────────── */
* { scrollbar-width: thin; scrollbar-color: var(--surface1) transparent; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--surface1); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--overlay0); }
::-webkit-scrollbar-track { background: transparent; }

/* ── 焦点环：全站统一，键盘可达性优先（WCAG 2.4.7） ─────────── */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ═══════════════ Tabline（buffer 列表） ═══════════════ */
#tabline {
  display: flex;
  align-items: stretch;
  background: var(--bg-deepest);
  border-bottom: 1px solid var(--line-soft);
  height: 30px;
  flex: 0 0 auto;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  user-select: none;
}
#tabline::-webkit-scrollbar { display: none; }
.tab {
  display: flex;
  align-items: center;
  gap: .35em;
  padding: 0 .85em;
  font-size: 12.5px;
  color: var(--overlay1);
  border-right: 1px solid var(--line-soft);
  white-space: nowrap;
  cursor: pointer;
  max-width: 15em;
  transition: color .12s var(--ease), background .12s var(--ease);
}
.tab:hover { color: var(--subtext1); background: var(--bg-deep); }
.tab.active {
  color: var(--fg);
  background: var(--bg);
  box-shadow: inset 0 -2px 0 var(--accent);
}
.tab .tab-name { overflow: hidden; text-overflow: ellipsis; }
.tab .tab-icon { color: var(--faint); font-size: 11px; }
.tab.active .tab-icon { color: var(--accent); }
.tab .tab-dot { color: var(--warn); font-size: 11px; }
.tab .tab-close {
  color: var(--surface2); font-size: 12px; padding: 0 .15em;
  border: 0; background: none; cursor: pointer; line-height: 1;
}
.tab .tab-close:hover { color: var(--err); }
.tab-new {
  padding: 0 .8em; font-size: 13px; color: var(--overlay0);
  background: none; border: 0; border-right: 1px solid var(--line-soft);
  cursor: pointer;
}
.tab-new:hover { color: var(--green); background: var(--bg-deep); }

/* ═══════════════ 主区域 ═══════════════ */
#view {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 1.6em 2.2em 4em;
  scroll-behavior: smooth;
}
#view.graph-active { padding: 0; display: flex; flex-direction: column; }
.kbd-inline {
  color: var(--warn); background: var(--bg-deep); border: 1px solid var(--line-soft);
  padding: 0 .3em; border-radius: var(--r-xs); font-size: 11.5px;
}

/* ═══════════════ 排版（markdown 渲染） ═══════════════ */
.doc { max-width: 62em; margin: 0 auto; }
.doc h1 { font-size: 1.55em; font-weight: 600; color: var(--fg); margin: 0 0 .5em; letter-spacing: -.01em; }
.doc h1::before { content: ''; }
.doc h2 { font-size: 1.22em; font-weight: 600; color: var(--accent); margin: 1.7em 0 .55em; padding-bottom: .25em; border-bottom: 1px solid var(--line-soft); }
.doc h3 { font-size: 1.05em; font-weight: 600; color: var(--accent2); margin: 1.4em 0 .45em; }
.doc h4 { font-size: .95em; font-weight: 600; color: var(--fg); margin: 1.2em 0 .4em; }
.doc h5, .doc h6 { font-size: .9em; font-weight: 600; color: var(--muted); margin: 1em 0 .35em; }
.doc p { margin: .72em 0; }
.doc ul, .doc ol { margin: .72em 0; padding-left: 1.5em; }
.doc li { margin: .22em 0; }
.doc li::marker { color: var(--overlay0); }
.doc blockquote {
  margin: .9em 0; padding: .35em 1em; border-left: 2px solid var(--mauve);
  background: var(--bg-deep); color: var(--subtext1); border-radius: 0 var(--r-sm) var(--r-sm) 0;
}
.doc code {
  font-family: var(--mono); font-size: .92em;
  background: var(--bg-deep); color: var(--warn);
  padding: .1em .38em; border-radius: var(--r-xs);
  border: 1px solid var(--line-soft);
}
.doc pre {
  margin: .9em 0; padding: .85em 1em; overflow-x: auto;
  background: var(--bg-deepest); border: 1px solid var(--line-soft);
  border-radius: var(--r-md); line-height: 1.5;
}
.doc pre code { background: none; border: 0; padding: 0; color: var(--subtext1); font-size: .9em; }
.doc a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
.doc a:hover { border-bottom-color: var(--accent); }
.doc a.wikilink {
  color: var(--link); background: color-mix(in srgb, var(--link) 8%, transparent);
  padding: .02em .25em; border-radius: var(--r-xs); border-bottom: 0;
}
.doc a.wikilink:hover { background: color-mix(in srgb, var(--link) 20%, transparent); color: var(--link); }
.doc a.wikilink.unresolved { color: var(--overlay0); background: none; border-bottom: 1px dashed var(--overlay0); }
.doc a.wikilink.unresolved:hover { color: var(--peach); border-bottom-color: var(--peach); }
.doc .tagline { color: var(--accent2); background: var(--bg-deep); padding: .02em .3em; border-radius: var(--r-xs); cursor: pointer; font-size: .95em; }
.doc .tagline:hover { background: var(--bg-deepest); filter: brightness(1.08); }
.doc hr { border: 0; border-top: 1px solid var(--line-soft); margin: 1.6em 0; }
.doc table { border-collapse: collapse; margin: 1em 0; font-size: .93em; width: 100%; display: block; overflow-x: auto; }
.doc th, .doc td { border: 1px solid var(--line); padding: .4em .7em; text-align: left; }
.doc th { background: var(--bg-deep); color: var(--fg); font-weight: 600; }
.doc tr:nth-child(2n) td { background: rgba(255,255,255,.014); }
.doc img { max-width: 100%; border-radius: var(--r-sm); }
.doc .mermaid { margin: 1em 0; text-align: center; overflow-x: auto; }
.doc .mermaid-error { border: 1px solid var(--err); border-radius: var(--r-sm); padding: .6em; }
.kb-embed {
  border-left: 2px solid var(--surface1); padding-left: 1em; margin: 1em 0;
  background: linear-gradient(90deg, var(--bg-deep), transparent 65%);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
}
.kb-embed-loading, .kb-embed-max { color: var(--faint); font-size: .9em; }
.kb-embed-create { color: var(--warn); cursor: pointer; }

/* ── 页面页眉：面包屑 / 元信息 ─────────────────────────────── */
.page-head { max-width: 62em; margin: 0 auto 1.4em; }
.crumbs { font-size: 12px; color: var(--faint); margin-bottom: .5em; }
.crumbs b { color: var(--muted); font-weight: 500; }
.page-meta { display: flex; flex-wrap: wrap; gap: .7em; align-items: center; font-size: 12px; color: var(--faint); margin-top: .55em; }
.page-meta .chip {
  color: var(--accent2); background: var(--bg-deep); border: 1px solid var(--line-soft);
  padding: .1em .5em; border-radius: var(--r-xs); cursor: pointer; font-size: 11.5px;
}
.page-meta .chip:hover { border-color: var(--mauve); }

/* ── 反向链接 ─────────────────────────────────────────────── */
.backlinks { max-width: 62em; margin: 2.4em auto 0; border-top: 1px solid var(--line-soft); padding-top: 1em; }
.backlinks h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--faint); font-weight: 600; margin-bottom: .6em; }
.bl-item { display: block; padding: .35em .6em; border-radius: var(--r-sm); cursor: pointer; border-left: 2px solid transparent; }
.bl-item:hover { background: var(--bg-deep); border-left-color: var(--accent); }
.bl-name { color: var(--link); font-size: 13px; }
.bl-snip { color: var(--faint); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ═══════════════ 列表视图（all / search / tag / trash） ═══════════════ */
.list-wrap { max-width: 62em; margin: 0 auto; }
.list-head {
  display: flex; align-items: center; gap: .75em; margin-bottom: 1.1em;
  padding-bottom: .55em; border-bottom: 1px solid var(--line-soft);
}
.list-head h1 { font-size: 1.1em; font-weight: 600; margin: 0; }
.list-head .count { color: var(--faint); font-size: 12px; }
.spacer { flex: 1 1 auto; }
.filterbar {
  display: flex; align-items: center; gap: .5em; margin-bottom: 1em;
  background: var(--bg-deep); border: 1px solid var(--line-soft);
  border-radius: var(--r-md); padding: .3em .7em;
}
.filterbar span { color: var(--faint); font-size: 13px; }
.filterbar input {
  flex: 1; background: none; border: 0; color: var(--fg); font-family: var(--mono);
  font-size: 13px; outline: none; padding: .3em 0;
}
.row {
  display: flex; align-items: baseline; gap: .8em; padding: .38em .65em;
  border-radius: var(--r-sm); cursor: pointer; border-left: 2px solid transparent;
  font-size: 13.5px;
}
.row:hover, .row.kb-sel, .row.kb-cursor { background: var(--bg-deep); border-left-color: var(--accent); }
/* 列表光标（j/k 移动）比 hover 更显眼一点：hover 只是过路，光标是「当前行」 */
.row.kb-cursor { background: var(--sel); border-left-width: 3px; }
.row.kb-cursor::before { content: '▎'; color: var(--accent); margin-right: -.4em; }
.row .row-name { color: var(--fg); flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .row-date { color: var(--faint); font-size: 11.5px; flex: 0 0 auto; margin-left: auto; padding-left: .8em; }
.row .row-snip { color: var(--muted); font-size: 11.5px; flex: 1 1 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .row-badge { font-size: 11px; padding: 0 .4em; border-radius: var(--r-xs); flex: 0 0 auto; }
.row-group {
  font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--faint); margin: 1.2em 0 .35em; font-weight: 600;
}
.empty { color: var(--faint); text-align: center; padding: 3em 1em; font-size: 13px; }
.empty .hintline { display: block; margin-top: .6em; color: var(--overlay0); font-size: 12px; }

/* 标签云 */
.tagcloud { display: flex; flex-wrap: wrap; gap: .45em; }
.tagcloud .chip {
  background: var(--bg-deep); border: 1px solid var(--line-soft); color: var(--accent2);
  padding: .2em .55em; border-radius: var(--r-xs); font-size: 12.5px; cursor: pointer;
}
.tagcloud .chip:hover { border-color: var(--accent2); filter: brightness(1.1); }
.tagcloud .chip .n { color: var(--faint); font-size: 11px; }

/* ═══════════════ 首页 dashboard ═══════════════ */
.dash { max-width: 62em; margin: 0 auto; }
.dash-title { font-size: 1.5em; font-weight: 600; letter-spacing: -.01em; }
.dash-sub { color: var(--faint); font-size: 12.5px; margin: .3em 0 1.8em; }
.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(16em, 1fr)); gap: 1.1em; }
.card {
  background: var(--bg-deep); border: 1px solid var(--line-soft);
  border-radius: var(--r-md); padding: .9em 1em;
}
.card h3 {
  font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
  color: var(--faint); font-weight: 600; margin: 0 0 .6em;
  display: flex; align-items: center; gap: .5em;
}
.card .big { font-size: 1.9em; font-weight: 600; line-height: 1.1; }
.card .unit { font-size: 11.5px; color: var(--faint); margin-left: .3em; }
.mini { list-style: none; }
.mini li {
  display: flex; gap: .6em; align-items: baseline; font-size: 12.5px;
  padding: .22em .3em; border-radius: var(--r-xs); cursor: pointer; color: var(--muted);
}
.mini li:hover { background: var(--bg-deepest); color: var(--fg); }
.mini li .t { color: var(--faint); font-size: 11px; margin-left: auto; flex: 0 0 auto; }
.mini li b { color: var(--fg); font-weight: 500; }

/* ═══════════════ 任务视图 ═══════════════ */
.task {
  display: flex; align-items: baseline; gap: .7em; padding: .34em .55em;
  border-radius: var(--r-sm); font-size: 13px; border-left: 2px solid transparent;
}
.task:hover { background: var(--bg-deep); }
.task .box { cursor: pointer; color: var(--overlay0); flex: 0 0 auto; }
.task .box:hover { color: var(--green); }
.task.done { opacity: .5; }
.task.done .task-title { text-decoration: line-through; }
.task .pri {
  font-size: 10.5px; font-weight: 700; padding: 0 .35em; border-radius: var(--r-xs);
  flex: 0 0 auto; letter-spacing: .03em;
}
.p1 { background: var(--p1bg); color: var(--on-solid); }
.p2 { background: var(--p2bg); color: var(--on-solid); }
.p3 { background: var(--p3bg); color: var(--on-solid); }
.p4 { background: var(--ok); color: var(--on-solid); }
.task .task-title { color: var(--fg); flex: 1 1 auto; }
.task .task-title a { color: var(--link); }
.task .due { color: var(--faint); font-size: 11.5px; flex: 0 0 auto; }
.task .due.over { color: var(--err); }
.task .due.today { color: var(--warn); }
.task .rec { color: var(--overlay0); font-size: 11px; flex: 0 0 auto; }

/* ═══════════════ 图谱 ═══════════════ */
#graphwrap { flex: 1 1 auto; position: relative; min-height: 0; }
#graph-svg { width: 100%; height: 100%; display: block; cursor: grab; }
.graph-hud {
  position: absolute; left: .9em; bottom: .9em; font-size: 11.5px; color: var(--faint);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  padding: .35em .7em; border-radius: var(--r-sm); border: 1px solid var(--line-soft);
  pointer-events: none;
}

/* ═══════════════ 编辑器 ═══════════════ */
#editor {
  flex: 1 1 auto; display: none; flex-direction: column; min-height: 0;
}
#editor.open { display: flex; }
#ed-bar {
  display: flex; align-items: center; gap: .8em; padding: .35em 1.1em;
  background: var(--bg-deep); border-bottom: 1px solid var(--line-soft);
  font-size: 12px; flex: 0 0 auto;
}
#ed-bar .ed-name { color: var(--fg); font-weight: 600; }
#ed-bar .ed-hint { color: var(--faint); }
#ed-bar .ed-actions { margin-left: auto; display: flex; gap: .5em; }
#ed-wrap { flex: 1 1 auto; min-height: 0; display: flex; }
#ed-wrap > .CodeMirror {
  flex: 1 1 auto; height: auto; font-family: var(--mono); font-size: 13.5px;
  line-height: 1.62; background: var(--bg); color: var(--fg);
}
#preview { flex: 1 1 auto; overflow-y: auto; padding: 1.5em 2em; display: none; }
#editor.preview-on #ed-wrap > .CodeMirror { display: none; }
#editor.preview-on #preview { display: block; }

.CodeMirror { background: var(--bg); }
.CodeMirror-gutters { background: var(--bg-deep); border-right: 1px solid var(--line-soft); }
.CodeMirror-linenumber { color: var(--surface2); font-size: 12px; }
.CodeMirror-cursor { border-left: 2px solid var(--accent); }
.CodeMirror-activeline-background { background: rgba(137,180,250,.055); }
.CodeMirror-selected { background: var(--sel) !important; }
.CodeMirror-dialog {
  background: var(--bg-deep); color: var(--fg); border-top: 1px solid var(--line);
  font-family: var(--mono); font-size: 13px; padding: .3em .8em;
}
.CodeMirror-dialog input { background: var(--bg); border: 1px solid var(--line); color: var(--fg);
  font-family: var(--mono); padding: .15em .5em; border-radius: var(--r-xs); }
.CodeMirror-search-match { background: rgba(249,226,175,.25); border: 0; }
.CodeMirror-matchingbracket { color: var(--green) !important; background: rgba(166,227,161,.1); }

/* ═══════════════ Statusline ═══════════════ */
#statusline {
  display: flex; align-items: stretch; height: 26px; flex: 0 0 auto;
  background: var(--bg-deepest); border-top: 1px solid var(--line-soft);
  font-size: 12px; user-select: none; overflow: hidden;
}
.sl-mode {
  display: flex; align-items: center; padding: 0 .8em; font-weight: 700;
  letter-spacing: .06em; font-size: 11.5px; text-transform: uppercase;
  background: var(--accent); color: var(--on-accent); flex: 0 0 auto;
}
.sl-mode.insert { background: var(--ok); color: var(--on-solid); }
.sl-mode.visual { background: var(--accent2); color: var(--on-accent); }
.sl-mode.replace { background: var(--err); color: var(--on-solid); }
.sl-mode.cmd { background: var(--warn); color: var(--on-solid); }
.sl-item {
  display: flex; align-items: center; gap: .3em; padding: 0 .7em;
  color: var(--subtext0); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sl-item.name { color: var(--fg); flex: 0 1 auto; min-width: 0; }
.sl-item.name .dirty { color: var(--warn); }
.sl-item.right { margin-left: auto; flex: 0 0 auto; }
.sl-sep { width: 1px; background: var(--line-soft); flex: 0 0 auto; }
.sl-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex: 0 0 auto; }
.sl-dot.off { background: var(--red); }
.sl-hint { color: var(--overlay0); }

/* ═══════════════ 命令行（: / 输入） ═══════════════ */
#cmdline {
  position: absolute; left: 0; right: 0; bottom: 26px; display: none;
  background: var(--bg-deep); border-top: 1px solid var(--line);
  padding: .35em 1em; z-index: 60; font-size: 13.5px;
  box-shadow: 0 -8px 24px rgba(0,0,0,.28);
}
#cmdline.open { display: block; }
#cmdline-row { display: flex; align-items: baseline; gap: .5em; }
#cmdline-prompt { color: var(--warn); font-weight: 700; flex: 0 0 auto; }
#cmdline-input {
  flex: 1 1 auto; background: none; border: 0; outline: none;
  color: var(--fg); font-family: var(--mono); font-size: 13.5px; caret-color: var(--accent);
}
#cmdline-hint { color: var(--faint); font-size: 11.5px; padding: .1em 0 0 .1em; }
#cmdline-hint .k { color: var(--accent); }

/* ═══════════════ which-key ═══════════════ */
#whichkey {
  position: absolute; right: 1em; bottom: 34px; display: none; z-index: 70;
  background: var(--bg-deep); border: 1px solid var(--line); border-radius: var(--r-md);
  box-shadow: 0 12px 34px rgba(0,0,0,.45); padding: .5em .6em; min-width: 15em;
  max-width: min(92vw, 30em);
}
#whichkey.open { display: block; }
.wk-head {
  display: flex; align-items: center; gap: .5em; font-size: 11.5px;
  color: var(--faint); margin-bottom: .35em; padding: 0 .3em;
}
.wk-head .wk-prefix {
  background: var(--accent); color: var(--on-accent); padding: 0 .38em;
  border-radius: var(--r-xs); font-weight: 700;
}
.wk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11.5em, 1fr)); gap: .1em .3em; }
.wk-row {
  display: flex; align-items: baseline; gap: .55em; padding: .2em .35em;
  border-radius: var(--r-xs); cursor: pointer; font-size: 12.5px;
}
.wk-row:hover, .wk-row.sel { background: var(--sel); }
.wk-key {
  color: var(--accent); font-weight: 700; flex: 0 0 auto; min-width: 2.2em;
}
.wk-label { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk-row.group .wk-key { color: var(--accent2); }
.wk-row.group .wk-label { color: var(--fg); }

/* ═══════════════ 覆盖层（help / versions / settings） ═══════════════ */
.overlay {
  position: fixed; inset: 0; display: none; z-index: 200;
  background: rgba(17,17,27,.62); backdrop-filter: blur(3px);
  padding: 4vh 1em; overflow-y: auto;
}
.overlay.open { display: block; }
.sheet {
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md);
  max-width: 56em; margin: 0 auto; box-shadow: 0 20px 50px rgba(0,0,0,.5);
}
.sheet-head {
  display: flex; align-items: center; gap: .7em; padding: .7em 1em;
  border-bottom: 1px solid var(--line-soft); position: sticky; top: 0;
  background: var(--bg); border-radius: var(--r-md) var(--r-md) 0 0; z-index: 1;
}
.sheet-head h3 { font-size: .95em; font-weight: 600; margin: 0; color: var(--fg); }
.sheet-head .spacer { flex: 1 1 auto; }
.sheet-body { padding: 1em 1.1em 1.4em; }

.btn {
  font-family: var(--mono); font-size: 12px; padding: .32em .8em;
  background: var(--bg-deep); color: var(--fg); border: 1px solid var(--line);
  border-radius: var(--r-sm); cursor: pointer; transition: all .12s var(--ease);
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { border-color: var(--err); color: var(--err); }
.btn.danger:hover { background: var(--err); color: var(--on-solid); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: var(--bg-deep); border-color: var(--line-soft); }
.btn-sm { font-size: 11.5px; padding: .2em .55em; }

/* help 表 */
.help-sec { margin-bottom: 1.6em; }
.help-sec h4 {
  font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
  color: var(--accent); margin-bottom: .5em; font-weight: 700;
}
.help-row { display: flex; gap: 1em; padding: .18em 0; font-size: 12.5px; }
.help-key { flex: 0 0 9.5em; color: var(--warn); }
.help-desc { color: var(--muted); }

/* 版本历史 */
.vlist { max-height: 55vh; overflow-y: auto; border: 1px solid var(--line-soft); border-radius: var(--r-sm); }
.vrow {
  display: flex; align-items: center; gap: .8em; padding: .4em .7em; font-size: 12.5px;
  border-bottom: 1px solid var(--line-soft); cursor: pointer;
}
.vrow:hover, .vrow.sel { background: var(--bg-deep); }
.vrow .vdate { color: var(--fg); }
.vrow .vsize { color: var(--faint); margin-left: auto; }
.vpreview {
  margin-top: .8em; max-height: 40vh; overflow-y: auto;
  background: var(--bg-deep); border: 1px solid var(--line-soft);
  border-radius: var(--r-sm); padding: .8em 1em;
}

/* 设置 */
.field { margin-bottom: 1em; }
.field label { display: block; font-size: 11.5px; text-transform: uppercase;
  letter-spacing: .08em; color: var(--faint); margin-bottom: .35em; }
.field input, .field textarea, .field select {
  width: 100%; background: var(--bg-deep); border: 1px solid var(--line);
  color: var(--fg); font-family: var(--mono); font-size: 13px;
  padding: .45em .65em; border-radius: var(--r-sm); outline: none;
}
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { min-height: 12em; resize: vertical; line-height: 1.5; }

/* ═══════════════ 链接悬浮预览 ═══════════════ */
#lp {
  position: fixed; z-index: 300; display: none; max-width: 34em;
  background: var(--bg-deep); border: 1px solid var(--line);
  border-radius: var(--r-md); box-shadow: 0 14px 40px rgba(0,0,0,.5);
  overflow: hidden;
}
#lp.open { display: block; }
#lp .lp-head { padding: .5em .8em; border-bottom: 1px solid var(--line-soft);
  display: flex; align-items: center; gap: .5em; font-size: 12.5px; color: var(--link); }
#lp .lp-body { padding: .6em .9em; font-size: 12.5px; color: var(--muted);
  max-height: 16em; overflow: hidden; line-height: 1.55; }
#lp .lp-body > * { margin: .2em 0; }
#lp .lp-body h1,#lp .lp-body h2,#lp .lp-body h3 { font-size: .95em; margin: .1em 0; }
#lp .lp-body pre,#lp .lp-body table,#lp .lp-body blockquote { display: none; }
#lp .lp-foot { padding: .35em .8em; border-top: 1px solid var(--line-soft);
  font-size: 11px; color: var(--faint); }

/* ═══════════════ Toast / 离线横幅 ═══════════════ */
#toast {
  position: fixed; left: 50%; transform: translateX(-50%) translateY(1.4em);
  bottom: 4.2em; z-index: 500; display: none; max-width: 88vw;
  background: var(--bg-deepest); color: var(--fg);
  border: 1px solid var(--line); border-left: 3px solid var(--ok);
  border-radius: var(--r-sm); padding: .45em .9em; font-size: 12.5px;
  box-shadow: 0 10px 28px rgba(0,0,0,.45); transition: transform .16s var(--ease), opacity .16s;
  opacity: 0;
}
#toast.show { display: block; opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.error { border-left-color: var(--err); }
#toast.warn { border-left-color: var(--warn); }
#offline-banner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 400;
  background: var(--warn); color: var(--on-solid); font-size: 12px; font-weight: 600;
  text-align: center; padding: .25em;
}

/* ═══════════════ 移动端 ═══════════════ */
@media (max-width: 760px) {
  body { font-size: 13px; }
  #view { padding: 1em .9em 3.4em; }
  .doc h1 { font-size: 1.35em; }
  #tabline { height: 32px; }
  .tab { font-size: 12px; padding: 0 .6em; max-width: 8.5em; }
  .tab .tab-close { display: none; }
  #statusline { height: 30px; font-size: 11.5px; }
  .sl-item { padding: 0 .45em; }
  .sl-item.name { max-width: 38vw; }
  .sl-hint, .sl-item.hide-mobile { display: none; }
  #cmdline { bottom: 30px; padding: .4em .7em; }
  #whichkey {
    left: .5em; right: .5em; bottom: 36px; max-width: none; max-height: 60vh; overflow-y: auto;
  }
  .wk-grid { grid-template-columns: 1fr; }
  .overlay { padding: 0; }
  .sheet { border-radius: 0; min-height: 100%; }
  .dash-grid { grid-template-columns: 1fr; }
  .help-key { flex: 0 0 7em; }
  #preview { padding: 1em; }
  .row .row-snip { display: none; }
}
/* ═══════════ 移动端动作坞（只在 touch 输入模式显示）═══════════ */
#fxdock {
  position: absolute; right: 14px; bottom: 44px; z-index: 55;
  display: none; flex-direction: column; align-items: flex-end; gap: 8px;
}
#fxdock.on { display: flex; }
.fx-panel {
  display: none; flex-direction: column; gap: 6px;
  background: color-mix(in srgb, var(--bg-deep) 92%, transparent);
  border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 8px; box-shadow: 0 10px 34px rgba(0,0,0,.42);
  backdrop-filter: blur(8px);
}
#fxdock.open .fx-panel { display: flex; }
.fx-btn {
  font-family: var(--mono); font-size: 13px; padding: .6em .95em;
  background: var(--bg-mantle); color: var(--fg); border: 1px solid var(--line);
  border-radius: var(--r-sm); cursor: pointer; text-align: left;
  display: flex; align-items: center; gap: .6em; min-width: 10.5em;
  transition: border-color .12s var(--ease), color .12s var(--ease);
}
.fx-btn:hover, .fx-btn:active { border-color: var(--accent); color: var(--accent); }
.fx-btn .fx-k { color: var(--faint); font-size: 11px; margin-left: auto; }
.fx-btn.primary { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.fx-btn.danger { border-color: var(--err); color: var(--err); }
.fx-toggle {
  width: 48px; height: 48px; border-radius: 50%;
  font-size: 20px; line-height: 1;
  background: var(--accent); color: var(--on-accent); border: 0;
  box-shadow: 0 6px 22px rgba(0,0,0,.4); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform .16s var(--ease), filter .12s var(--ease);
}
.fx-toggle:hover { filter: brightness(1.1); }
#fxdock.open .fx-toggle { transform: rotate(45deg); }

/* ═══════════ 移动端数字盘（LazyVim 三方案）═══════════ */
#numgrid {
  position: absolute; inset: 0; z-index: 70; display: none;
  background: rgba(0,0,0,.42); backdrop-filter: blur(2px);
  align-items: flex-end;
}
#numgrid.open { display: flex; }
.ng-sheet {
  width: 100%; background: var(--bg-deep); border-top: 1px solid var(--line);
  border-radius: var(--r-md) var(--r-md) 0 0; padding: .6em .7em calc(.8em + env(safe-area-inset-bottom));
  box-shadow: 0 -12px 40px rgba(0,0,0,.45);
  animation: ngUp .18s var(--ease);
}
@keyframes ngUp { from { transform: translateY(28px); opacity: .4; } to { transform: none; opacity: 1; } }
.ng-head {
  display: flex; align-items: center; gap: .6em; font-size: 11.5px;
  color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: .5em;
}
.ng-sec { margin-left: auto; color: var(--accent); font-weight: 700; }
.ng-x { width: 32px; text-align: center; font-size: 17px; color: var(--muted); cursor: pointer; }
.ng-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.ng-key {
  aspect-ratio: 1.25; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; cursor: pointer;
  background: var(--bg-mantle); border: 1px solid var(--line-soft);
  border-radius: var(--r-sm); transition: all .1s var(--ease);
}
.ng-key:active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.ng-num { font-family: var(--mono); font-size: 15px; font-weight: 700; }
.ng-lbl { font-size: 10px; color: var(--muted); line-height: 1; }
.ng-key:active .ng-lbl { color: var(--on-accent); }
.ng-foot { margin-top: .55em; font-size: 11px; color: var(--faint); display: flex; gap: .8em; }
.ng-foot .k { color: var(--accent); font-weight: 700; }

/* statusline 的模式徽标在 touch 下可点 */
.sl-mode.tappable::after { content: ' ▾'; opacity: .7; font-size: 9px; }

/* ═══════════ touch-ui（移动端输入模式）═══════════ */
body.touch-ui #tabline { height: 34px; }
body.touch-ui .tab-summary {
  display: flex; align-items: center; gap: .5em; height: 100%; padding: 0 .8em;
  color: var(--fg); cursor: pointer; flex: 1 1 auto; font-size: 13px;
}
body.touch-ui .tab-sum {
  color: var(--accent); font-size: 13px;
}
body.touch-ui .tab-sum-count {
  font-size: 10.5px; padding: .1em .4em; border-radius: 999px;
  background: var(--bg-mantle); color: var(--muted);
}
body.touch-ui .tab-sum-caret { margin-left: auto; color: var(--faint); font-size: 11px; }
body.touch-ui .tab-fold {
  flex: 0 0 auto; width: 30px; background: none; border: 0;
  color: var(--faint); font-size: 12px; cursor: pointer;
}
body.touch-ui #view { padding-bottom: 5.2em; }
body.touch-ui .sl-mode { cursor: pointer; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>

<!-- ═══════════ tabline ═══════════ -->
<div id="tabline" role="tablist" aria-label="已打开页面"></div>

<!-- ═══════════ 主区域 ═══════════ -->
<div id="view" role="main"></div>

<!-- ═══════════ 编辑器 ═══════════ -->
<div id="editor">
  <div id="ed-bar">
    <span class="ed-name" id="ed-name"></span>
    <span class="ed-hint" id="ed-hint"></span>
    <div class="ed-actions">
      <button class="btn btn-sm" onclick="togglePreview()" title="切换预览 (space p)">预览</button>
      <button class="btn btn-sm" onclick="openVersions()" title="版本历史 (:versions)">历史</button>
      <button class="btn btn-sm primary" onclick="saveEditor()" title="保存 (:w / Ctrl+S)">写 (:w)</button>
    </div>
  </div>
  <div id="ed-wrap"><textarea id="cm"></textarea><div id="preview"></div></div>
</div>

<!-- ═══════════ statusline ═══════════ -->
<div id="statusline">
  <div class="sl-mode" id="sl-mode">NORMAL</div>
  <div class="sl-item name" id="sl-name">—</div>
  <div class="sl-sep"></div>
  <div class="sl-item" id="sl-pos">Ln 1, Col 1</div>
  <div class="sl-sep"></div>
  <div class="sl-item hide-mobile" id="sl-words">0 字</div>
  <div class="sl-item right hide-mobile" id="sl-pages">—</div>
  <div class="sl-sep hide-mobile"></div>
  <div class="sl-item" id="sl-theme">mocha</div>
  <div class="sl-sep"></div>
  <div class="sl-item" id="sl-net"><span class="sl-dot"></span><span class="sl-hint">sync</span></div>
  <div class="sl-sep"></div>
  <div class="sl-item" id="sl-clock">--:--</div>
</div>

<!-- ═══════════ 命令行 ═══════════ -->
<div id="cmdline">
  <div id="cmdline-row">
    <span id="cmdline-prompt">:</span>
    <input id="cmdline-input" autocomplete="off" spellcheck="false" autocapitalize="off"
           aria-label="命令行">
  </div>
  <div id="cmdline-hint"></div>
</div>

<!-- ═══════════ which-key ═══════════ -->
<div id="whichkey"></div>

<!-- ═══════════ 覆盖层 ═══════════ -->
<div class="overlay" id="ov-help">
  <div class="sheet">
    <div class="sheet-head">
      <h3>快捷键</h3><span class="spacer"></span>
      <button class="btn" onclick="closeOverlays()">Esc</button>
    </div>
    <div class="sheet-body" id="help-body"></div>
  </div>
</div>

<div class="overlay" id="ov-versions">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="ov-versions-title">版本历史</h3><span class="spacer"></span>
      <button class="btn" onclick="closeOverlays()">Esc</button>
    </div>
    <div class="sheet-body">
      <div class="vlist" id="vlist"></div>
      <div class="vpreview" id="vpreview" style="display:none"></div>
      <div style="margin-top:.8em;display:flex;gap:.5em">
        <button class="btn primary" id="vrestore" disabled onclick="restoreVersion()">恢复此版本</button>
        <button class="btn danger" onclick="purgeVersions()">清理该页历史</button>
        <span class="spacer"></span>
        <span id="vnote" class="sl-hint" style="font-size:11.5px"></span>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="ov-settings">
  <div class="sheet">
    <div class="sheet-head">
      <h3>设置</h3><span class="spacer"></span>
      <button class="btn" onclick="closeOverlays()">Esc</button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label>任务来源页面（逗号分隔，任务视图可切换）</label>
        <input id="set-taskpage" placeholder="Tasks">
      </div>
      <div class="field">
        <label>首页看板页面（首页顶部渲染该页内容）</label>
        <input id="set-dashboard" placeholder="留空则用统计面板">
      </div>
      <div class="field">
        <label>自定义 CSS（保存到 data/custom.css，实时生效）</label>
        <textarea id="set-css" placeholder="body { }"></textarea>
      </div>
      <div style="display:flex;gap:.5em">
        <button class="btn primary" onclick="saveSettings()">保存</button>
        <button class="btn" onclick="exportData('zip')">导出 zip</button>
        <button class="btn" onclick="exportData('json')">导出 json</button>
        <button class="btn" onclick="document.getElementById('import-file').click()">导入</button>
        <button class="btn danger" onclick="openTrash()">回收站</button>
      </div>
      <input type="file" id="import-file" accept=".zip,.json,.md,.txt" multiple style="display:none"
             onchange="importFiles(this.files)">
    </div>
  </div>
</div>

<div class="overlay" id="ov-trash">
  <div class="sheet">
    <div class="sheet-head">
      <h3>回收站</h3><span class="spacer"></span>
      <button class="btn" onclick="closeOverlays()">Esc</button>
    </div>
    <div class="sheet-body"><div id="trash-list"></div></div>
  </div>
</div>

<div class="overlay" id="ov-pick">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="pick-title">选择</h3><span class="spacer"></span>
      <button class="btn" onclick="closeOverlays()">Esc</button>
    </div>
    <div class="sheet-body">
      <div class="filterbar"><span id="pick-prompt">&gt;</span>
        <input id="pick-input" autocomplete="off" spellcheck="false" aria-label="筛选">
      </div>
      <div id="pick-list"></div>
    </div>
  </div>
</div>

<!-- 移动端动作坞 -->
<div id="fxdock" aria-hidden="true">
  <div class="fx-panel" id="fx-panel"></div>
  <button class="fx-toggle" id="fx-toggle" aria-label="动作坞（移动端命令入口）">＋</button>
</div>

<!-- 移动端数字盘：LazyVim 三方案映射 -->
<div id="numgrid" aria-hidden="true">
  <div class="ng-sheet">
    <div class="ng-head"><span>数字跳转</span><span class="ng-sec">M</span><span class="ng-x" id="ng-close" role="button" aria-label="关闭">×</span></div>
    <div class="ng-grid" id="ng-grid"></div>
    <div class="ng-foot" id="ng-foot"></div>
  </div>
</div>

<div id="lp"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var base = (window.__KB_BASE__ || '');
  function load(src) {
    return new Promise(function (res) {
      var s = document.createElement('script');
      s.src = base + src;
      s.onload = res; s.onerror = res;
      document.body.appendChild(s);
    });
  }
  /* 加载顺序（都是同步串行，defer 语义）：
       面板容器 → 插件内核 → 插件清单 → 主程序
     主题注册表必须先于 app.js，因为启动时就要应用配色。 */
  load('/static/themes/index.js')
    .then(function () { return load('/static/panel.js'); })
    .then(function () { return load('/static/plugin.js'); })
    .then(function () { return load('/static/plugins/index.js'); })
    .then(function () { return load('/static/app.js'); });
