let currentTasks = [];        // tasks from last render (for checkbox handlers)
let todoSourceContent = '';   // raw content of task source page
let todoCurrentView = 'list';

async function toggleTaskDone(task) {
  const taskPage = getTaskPage();
  try {
    // Always work on the latest content (bypass cache)
    const resp = await fetch(`${API}/pages/${encodeURIComponent(taskPage)}`);
    if (!resp.ok) { showToast('任务页不可读', 'error'); return; }
    const page = await resp.json();
    const lines = page.content.split('\n');
    const idx = lines.findIndex(l => l.trim() === task.raw.trim());
    if (idx === -1) { showToast('任务行已变化，刷新后重试', 'error'); return; }

    const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    let newLine;

    if (task.doneDate) {
      // Un-complete: strip done:DATE
      newLine = task.raw.replace(/\s+done:\S+\s*$/i, '').trimEnd();
    } else if (task.rec) {
      // Recurring: roll to next cycle, stays active
      const nextDue = recalcRecurring(task, today);
      if (!nextDue) { showToast('无法计算重复周期', 'error'); return; }
      const base = task.raw.replace(/\s+due:\S+/g, '').replace(/\s+rec:\S+/g, '').replace(/\s+done:\S+\s*$/i, '').trimEnd();
      newLine = base + ' due:' + nextDue + ' ' + task.rec;
      showToast(`🔁 已滚动到 ${nextDue}`);
    } else {
      // Complete: append done:today
      newLine = task.raw.replace(/\s+done:\S+\s*$/i, '').trimEnd() + ' done:' + today;
      showToast('✓ 已完成');
    }

    lines[idx] = newLine;
    const putResp = await fetch(`${API}/pages/${encodeURIComponent(taskPage)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: lines.join('\n') }),
    });
    if (!putResp.ok) { showToast('保存失败', 'error'); return; }
    invalidateCache();
    renderTodo(todoCurrentView);
  } catch (e) {
    showToast('操作失败: ' + e.message, 'error');
  }
}

async function showTodo() {
  hideAll();
  document.getElementById('todo-view').style.display = 'block';

async function renderTodo(view) {
  const content = document.getElementById('todo-content');
  content.innerHTML = '<div style="padding:20px;color:var(--muted)">加载中...</div>';
  try {
    const page = await cachedFetch(`page:${getTaskPage()}`, `${API}/pages/${encodeURIComponent(getTaskPage())}`);
    todoSourceContent = page.content;
    const tasks = parseTasks(page.content);
    if (tasks.length === 0) {
      content.innerHTML = '<div style="padding:20px;color:var(--muted)">该页面没有检测到任务。任务格式：<br><code>p1 2024-01-15 [[相关页面]] 任务内容 due:2024-01-20 rec:1w</code></div>';
      return;
    }
    currentTasks = tasks;
    if (view === 'gantt') {
      ganttChart = null;  // force re-create
      renderGantt(tasks);
    } else {
      renderList(tasks);
    }
  } catch (e) {
    if (String(e.message).includes('404')) {
      content.innerHTML = `<div style="padding:20px;color:var(--muted)">页面 "${escapeHtml(getTaskPage())}" 不存在。请在设置中指定任务来源页面（多个用逗号分隔）。</div>`;
    } else {
      content.innerHTML = `<div style="padding:20px;color:#e74c3c">错误: ${escapeHtml(e.message)}</div>`;
    }
  }
}

let todoFilter = 'all';
let todoSort = 'due';

function computeTaskStats(tasks) {
  const today = new Date().toISOString().slice(0, 10);
  const weekEnd = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);
  const s = { overdue: 0, today: 0, week: 0, done: 0 };
  for (const t of tasks) {
    if (t.doneDate) { s.done++; continue; }
    if (t.dueDate) {
      if (t.dueDate < today) s.overdue++;
      else if (t.dueDate === today) s.today++;
      else if (t.dueDate <= weekEnd) s.week++;
    }
  }
  return s;
}

function applyTaskFilter(tasks) {
  const today = new Date().toISOString().slice(0, 10);
  const weekEnd = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);
  let out = tasks;
  switch (todoFilter) {
    case 'active': out = tasks.filter(t => !t.doneDate); break;
    case 'overdue': out = tasks.filter(t => !t.doneDate && t.dueDate && t.dueDate < today); break;
    case 'today': out = tasks.filter(t => !t.doneDate && t.dueDate === today); break;
    case 'week': out = tasks.filter(t => !t.doneDate && t.dueDate && t.dueDate >= today && t.dueDate <= weekEnd); break;
    case 'done': out = tasks.filter(t => t.doneDate); break;
  }
  const prioOrder = { p1: 0, p2: 1, p3: 2, p4: 3 };
  if (todoSort === 'due') {
    out = [...out].sort((a, b) => {
      if (!a.dueDate && !b.dueDate) return 0;
      if (!a.dueDate) return 1;
      if (!b.dueDate) return -1;
      return a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : 0;
    });
  } else if (todoSort === 'priority') {
    out = [...out].sort((a, b) => prioOrder[a.priority] - prioOrder[b.priority]);
  } else if (todoSort === 'created') {
    out = [...out].sort((a, b) => a.startDate < b.startDate ? -1 : a.startDate > b.startDate ? 1 : 0);
  }
  return out;
}

function setTodoFilter(f) {
  todoFilter = f;
  renderTodo(todoCurrentView);
}

function setTodoSort(s) {
  todoSort = s;
  renderTodo(todoCurrentView);
}

async function quickAddTask(text) {
  text = text.trim();
  if (!text) return;
  const input = document.getElementById('quick-add-input');
  if (input) input.value = '';
  const taskPage = getTaskPage();
  try {
    const resp = await fetch(`${API}/pages/${encodeURIComponent(taskPage)}`);
    if (!resp.ok) { showToast('任务页不可读', 'error'); return; }
    const page = await resp.json();

    const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    let line;
    if (/^\s*(p[1-4]|\d)\s+\d{4}-\d{2}-\d{2}\s+/i.test(text)) {
      line = text;  // full task syntax
    } else {
      line = 'p2 ' + today + ' ' + text;  // plain text → default p2, starts today
    }

    const newContent = (page.content || '').trimEnd() + '\n' + line;
    const putResp = await fetch(`${API}/pages/${encodeURIComponent(taskPage)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: newContent }),
    });
    if (!putResp.ok) { showToast('保存失败', 'error'); return; }
    invalidateCache();
    renderTodo(todoCurrentView);
    showToast('✓ 已添加');
  } catch (e) {
    showToast('添加失败: ' + e.message, 'error');
  }
}

function renderList(tasks) {
  const content = document.getElementById('todo-content');
  const today = new Date().toISOString().slice(0, 10);
  const stats = computeTaskStats(tasks);
  const shown = applyTaskFilter(tasks);
  currentTasks = shown;

  // Quick add + stats bar (clickable filters)
  let html = `<input type="text" id="quick-add-input" class="todo-quickadd" placeholder="+ 新任务，回车添加（支持 p1 due:2026-09-30 rec:1w 完整语法，纯文本默认 p2 今天开始）" onkeydown="if(event.key==='Enter')quickAddTask(this.value)">`;
  const statItems = [
    { key: 'all', label: `全部 ${tasks.length}`, cls: '' },
    { key: 'overdue', label: `🔴 逾期 ${stats.overdue}`, cls: '' },
    { key: 'today', label: `🟠 今天 ${stats.today}`, cls: '' },
    { key: 'week', label: `🔵 本周 ${stats.week}`, cls: '' },
    { key: 'done', label: `✓ 已完成 ${stats.done}`, cls: '' },
  ];
  html += `<div class="todo-stats">`;
  for (const s of statItems) {
    html += `<button class="todo-stat${todoFilter === s.key ? ' active' : ''}" onclick="setTodoFilter('${s.key}')">${s.label}</button>`;
  }
  html += `<select class="todo-sort" onchange="setTodoSort(this.value)" title="排序">
    <option value="due"${todoSort === 'due' ? ' selected' : ''}>按截止日</option>
    <option value="priority"${todoSort === 'priority' ? ' selected' : ''}>按优先级</option>
    <option value="created"${todoSort === 'created' ? ' selected' : ''}>按开始日</option>
  </select>`;
  html += `</div>`;

  if (shown.length === 0) {
    html += `<div style="padding:20px;color:var(--muted)">没有符合条件的任务</div>`;
  }

  shown.forEach((t, i) => {
    const isDone = !!t.doneDate;
    const isOverdue = !isDone && t.dueDate && t.dueDate < today;
    const links = t.links.map(l => `<a href="#" data-page="${escapeHtml(l)}" style="color:var(--accent)">${escapeHtml(l)}</a>`).join(', ');
    html += `<div class="todo-list-item${isDone ? ' task-done' : ''}">
      <input type="checkbox" class="task-check" ${isDone ? 'checked' : ''} onchange="toggleTaskDone(currentTasks[${i}])" title="${isDone ? '取消完成' : t.rec ? '完成并滚动到下周期' : '标记完成'}">
      <div class="priority ${t.priority}">${t.priority.slice(1)}</div>
      <div class="task-info">
        <div class="task-title">${escapeHtml(t.title)}</div>
        ${links ? `<div class="task-meta">${links}</div>` : ''}
      </div>
      <div class="task-due${isOverdue ? ' overdue' : ''}">${t.dueDate || '—'}${t.rec ? ' <span class="rec-badge">🔁</span>' : ''}</div>
    </div>`;
  });
  content.innerHTML = html;
}

let ganttChart = null;
let ganttCurrentMode = 'Month';
let allGanttTasks = [];
let ganttDateFrom = null;
let ganttDateTo = null;

function filterGanttTasks() {
  let tasks = allGanttTasks;
  if (ganttDateFrom || ganttDateTo) {
    tasks = allGanttTasks.filter(t => {
      const s = t.startDate;
      const e = t.dueDate || t.startDate;
      if (ganttDateFrom && e < ganttDateFrom) return false;
      if (ganttDateTo && s > ganttDateTo) return false;
      return true;
    });
  }
  return tasks;
}

function updateGanttRange() {
  ganttDateFrom = document.getElementById('gantt-date-from').value || null;
  ganttDateTo = document.getElementById('gantt-date-to').value || null;
  // Destroy and recreate — Frappe Gantt doesn't support set date range
  ganttChart = null;
  renderGantt(allGanttTasks);
}

function ganttPriorityColor(p) {
  const map = { p1: '--p1', p2: '--p2', p3: '--p3', p4: '--p4' };
  const v = map[p]
    ? getComputedStyle(document.documentElement).getPropertyValue(map[p]).trim()
    : '';
  return v || 'var(--accent)';
}

function colorGanttBars() {
  setTimeout(() => {
    const bars = document.querySelectorAll('#gantt-area .bar');
    bars.forEach((bar, i) => {
      const t = ganttRenderTasks[i];
      if (t) {
        bar.setAttribute('fill', ganttPriorityColor(t.priority));
        if (t.phantom) bar.setAttribute('fill-opacity', '0.4');
      }
    });
  }, 50);
}

// Advance a due date by one recurrence cycle (pure date math, no completion semantics)
function nextCycleDate(dueDate, rec) {
  const d = new Date(dueDate);
  switch (rec) {
    case 'rec:1w': d.setDate(d.getDate() + 7); return d.toISOString().slice(0, 10);
    case 'rec:+1m': d.setMonth(d.getMonth() + 1); return d.toISOString().slice(0, 10);
    case 'rec:1b': {
      let added = 0;
      while (added < 1) {
        d.setDate(d.getDate() + 1);
        if (d.getDay() !== 0 && d.getDay() !== 6) added++;
      }
      return d.toISOString().slice(0, 10);
    }
    case 'rec:3b': {
      let added = 0;
      while (added < 3) {
        d.setDate(d.getDate() + 1);
        if (d.getDay() !== 0 && d.getDay() !== 6) added++;
      }
      return d.toISOString().slice(0, 10);
    }
    case 'rec:+1y': d.setFullYear(d.getFullYear() + 1); return d.toISOString().slice(0, 10);
    default: {
      const m = rec.match(/^rec:(\d+)(w|d)$/);
      if (m) {
        const n = parseInt(m[1]);
        d.setDate(d.getDate() + (m[2] === 'w' ? n * 7 : n));
        return d.toISOString().slice(0, 10);
      }
      return null;
    }
  }
}

let ganttRenderTasks = [];  // full render list incl. phantom occurrences (for bar coloring)

function renderGantt(tasks) {
  const content = document.getElementById('todo-content');
  content.innerHTML = '<div id="gantt-area" style="width:100%;overflow-x:auto"></div>';

  allGanttTasks = tasks;
  const filtered = filterGanttTasks();
  ganttDateFrom = null;
  ganttDateTo = null;
  document.getElementById('gantt-date-from').value = '';
  document.getElementById('gantt-date-to').value = '';

  const ganttTasks = [];
  const renderMeta = [];
  filtered.forEach((t, i) => {
    ganttTasks.push({
      id: 'task-' + i,
      name: t.title,
      start: t.startDate,
      end: t.dueDate || t.startDate,
      _priority: t.priority,
      _links: t.links,
      _rec: t.rec,
      progress: 0,
    });
    renderMeta.push({ priority: t.priority, phantom: false });

    // Recurring tasks: preview next 2 cycles as phantom bars
    if (t.rec && t.dueDate) {
      let due = t.dueDate;
      for (let occ = 1; occ <= 2; occ++) {
        const next = nextCycleDate(due, t.rec);
        if (!next) break;
        ganttTasks.push({
          id: `task-${i}-occ${occ}`,
          name: `${t.title}·第${occ + 1}期`,
          start: due,
          end: next,
          _priority: t.priority,
          _links: t.links,
          _rec: t.rec,
          progress: 0,
        });
        renderMeta.push({ priority: t.priority, phantom: true });
        due = next;
      }
    }
  });
  ganttRenderTasks = renderMeta;

  if (ganttChart) ganttChart.change_view_mode(ganttCurrentMode);
  else {
    ganttChart = new Gantt('#gantt-area', ganttTasks, {
      view_mode: ganttCurrentMode,
      date_format: 'YYYY-MM-DD',
      language: 'zh',
      custom_popup_html: (task) => {
        const p = task._priority || 'p3';
        const links = task._links && task._links.length
          ? task._links.map(l => `<a href="#" data-page="${escapeHtml(l)}" style="color:var(--accent)">${escapeHtml(l)}</a>`).join(', ')
          : '';
        const rec = task._rec ? `<br>🔁 ${escapeHtml(task._rec)}` : '';
        return `<div style="padding:10px;background:var(--card);border:1px solid var(--border);border-radius:6px;min-width:180px">
          <div style="font-weight:600;margin-bottom:4px">${escapeHtml(task.name)}</div>
          <div style="font-size:12px;color:var(--muted)">📅 ${task.start} → ${task.end}${rec}</div>
          ${links ? `<div style="font-size:12px;color:var(--muted);margin-top:4px">🔗 ${links}</div>` : ''}
          <div style="margin-top:6px"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${ganttPriorityColor(p)};margin-right:4px"></span>优先级 ${p.slice(1)}</div>
        </div>`;
      },
      on_click: (task) => {},
    });
  }

  colorGanttBars();
}

function setGanttMode(mode) {
  ganttCurrentMode = mode;
  document.querySelectorAll('#gantt-view-modes button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  if (ganttChart) {
    ganttChart.change_view_mode(mode);
    colorGanttBars();
  }
}

// Export the current task page as a mermaid gantt code block (one-way flow:
// tasks → text; pasting it into a page makes it ordinary, editable markdown).
async function copyTasksAsMermaidGantt() {
  if (!allGanttTasks.length) { showToast('当前没有任务'); return; }
  const lines = ['gantt', '  dateFormat YYYY-MM-DD', '  axisFormat %m-%d', '  section 任务'];
  for (const t of allGanttTasks) {
    const name = t.title.replace(/:/g, '：').replace(/,/g, '，');
    const tags = [t.doneDate ? 'done' : null, t.priority].filter(Boolean).join(', ');
    lines.push(`  ${name} :${tags}, ${t.startDate}, ${t.dueDate || t.startDate}`);
  }
  const code = '```mermaid\n' + lines.join('\n') + '\n```';
  try {
    await navigator.clipboard.writeText(code);
    showToast('已复制 mermaid 甘特代码块，粘贴到任意页面即可渲染');
  } catch (e) {
    showToast('复制失败: ' + e.message, 'error');
  }
}


// ── Graph ──────────────────────────────────────────────────────

let graphTransform = { x: 0, y: 0, k: 1 };
let graphNodes = [];
let graphNodeMap = {};
let graphEdges = [];
let graphDrag = null;

function applyGraphTransform() {
  const g = document.getElementById('graph-transform');
  if (g) g.setAttribute('transform', `translate(${graphTransform.x},${graphTransform.y}) scale(${graphTransform.k})`);
}

function graphZoomAt(cx, cy, factor) {
  const k2 = Math.max(0.1, Math.min(5, graphTransform.k * factor));
  const ratio = k2 / graphTransform.k;
  graphTransform.x = cx - (cx - graphTransform.x) * ratio;
  graphTransform.y = cy - (cy - graphTransform.y) * ratio;
  graphTransform.k = k2;
  applyGraphTransform();
}

function resetGraphView() {
  const svg = document.getElementById('graph-svg');
  if (!svg || graphNodes.length === 0) return;
  const w = svg.clientWidth, h = svg.clientHeight;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const n of graphNodes) {
    if (n.x < minX) minX = n.x;
    if (n.x > maxX) maxX = n.x;
    if (n.y < minY) minY = n.y;
    if (n.y > maxY) maxY = n.y;
  }
  const bw = Math.max(maxX - minX, 100);
  const bh = Math.max(maxY - minY, 100);
  const k = Math.min(w / (bw + 100), h / (bh + 100), 2);
  graphTransform.k = k;
  graphTransform.x = w / 2 - (minX + maxX) / 2 * k;
  graphTransform.y = h / 2 - (minY + maxY) / 2 * k;
  applyGraphTransform();
}

function updateGraphNode(node) {
  const sel = `#graph-transform [data-name="${CSS.escape(node.name)}"]`;
  document.querySelectorAll(sel).forEach(el => {
    if (el.tagName === 'circle') {
      el.setAttribute('cx', node.x);
      el.setAttribute('cy', node.y);
    } else if (el.tagName === 'text') {
      el.setAttribute('x', node.x + 10);
      el.setAttribute('y', node.y + 4);
    }
  });
  for (const e of graphEdges) {
    if (e.source === node.name || e.target === node.name) {
      const line = document.querySelector(`#graph-transform line[data-edge="${CSS.escape(e.source)}→${CSS.escape(e.target)}"]`);
      if (line) {
        const s = graphNodeMap[e.source];
        const t = graphNodeMap[e.target];
        if (s && t) {
          line.setAttribute('x1', s.x); line.setAttribute('y1', s.y);
          line.setAttribute('x2', t.x); line.setAttribute('y2', t.y);
        }
      }
    }
  }
}

async function showGraph() {
  hideAll();
  document.getElementById('content').classList.add('graph-active');
  document.getElementById('graph-view').style.display = 'flex';
  const data = await cachedFetch('graph', `${API}/graph`);
  document.getElementById('graph-stats').textContent = `${data.nodes.length} 节点 · ${data.edges.length} 边`;

  // Circular layout (deterministic)
  const R = Math.max(data.nodes.length * 4, 200);
  graphNodes = data.nodes.map((n, i) => {
    const angle = (i / data.nodes.length) * Math.PI * 2;
    return { name: n.name, x: Math.cos(angle) * R + R + 50, y: Math.sin(angle) * R + R + 50 };
  });
  graphNodeMap = {};
  graphNodes.forEach(n => graphNodeMap[n.name] = n);
  graphEdges = data.edges;

  // Build SVG
  const g = document.getElementById('graph-transform');
  let svg = '';
  for (const e of data.edges) {
    const s = graphNodeMap[e.source];
    const t = graphNodeMap[e.target];
    if (!s || !t) continue;
    svg += `<line class="gedge" data-edge="${escapeHtml(e.source)}→${escapeHtml(e.target)}" x1="${s.x}" y1="${s.y}" x2="${t.x}" y2="${t.y}" stroke-width="1"/>`;
  }
  for (const n of graphNodes) {
    const deg = data.edges.filter(e => e.source === n.name || e.target === n.name).length;
    const r = 4 + Math.min(deg, 10);
    svg += `<circle data-name="${escapeHtml(n.name)}" class="gnode${deg === 0 ? ' gnode-dim' : ''}" cx="${n.x}" cy="${n.y}" r="${r}" fill="var(--accent)" style="cursor:pointer"/>`;
    svg += `<text data-name="${escapeHtml(n.name)}" class="glabel" x="${n.x + 10}" y="${n.y + 4}" font-size="11">${escapeHtml(n.name)}</text>`;
  }
  g.innerHTML = svg;

  setTimeout(resetGraphView, 0);

  // Bind events once
  if (!showGraph._bound) {
    showGraph._bound = true;
    const svgEl = document.getElementById('graph-svg');
    const container = document.getElementById('graph-container');
    const tooltip = document.getElementById('graph-tooltip');

    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = container.getBoundingClientRect();
      graphZoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.1 : 0.9);
    }, { passive: false });

    svgEl.addEventListener('mousedown', (e) => {
      const circle = e.target.closest('circle[data-name]');
      if (circle) {
        graphDrag = { node: graphNodeMap[circle.dataset.name], _startX: e.clientX, _startY: e.clientY, _moved: false };
      } else {
        graphDrag = { pan: true, _startX: e.clientX, _startY: e.clientY, _tx: graphTransform.x, _ty: graphTransform.y };
        svgEl.style.cursor = 'grabbing';
      }
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!graphDrag) return;
      const dx = e.clientX - graphDrag._startX;
      const dy = e.clientY - graphDrag._startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) graphDrag._moved = true;
      if (graphDrag.pan) {
        graphTransform.x = graphDrag._tx + dx;
        graphTransform.y = graphDrag._ty + dy;
        applyGraphTransform();
      } else if (graphDrag.node) {
        const rect = container.getBoundingClientRect();
        const gx = (e.clientX - rect.left - graphTransform.x) / graphTransform.k;
        const gy = (e.clientY - rect.top - graphTransform.y) / graphTransform.k;
        graphDrag.node.x = gx;
        graphDrag.node.y = gy;
        updateGraphNode(graphDrag.node);
      }
    });

    document.addEventListener('mouseup', () => {
      graphDrag = null;
      svgEl.style.cursor = 'grab';
    });

    svgEl.addEventListener('click', (e) => {
      const circle = e.target.closest('circle[data-name]');
      if (circle && (!graphDrag || !graphDrag._moved)) {
        navigate('page', circle.dataset.name);
      }
    });

    function graphClearFocus() {
      document.querySelectorAll('#graph-transform circle').forEach(c => c.classList.remove('gnode-dim', 'gnode-hot'));
      document.querySelectorAll('#graph-transform text').forEach(t2 => { t2.style.opacity = ''; });
      document.querySelectorAll('#graph-transform line').forEach(l => l.classList.remove('gedge-hot'));
    }

    function graphSetFocus(name) {
      graphClearFocus();
      const linked = new Set([name]);
      for (const e2 of graphEdges) {
        if (e2.source === name) linked.add(e2.target);
        if (e2.target === name) linked.add(e2.source);
      }
      document.querySelectorAll('#graph-transform circle').forEach(c => {
        const nm = c.dataset.name;
        c.classList.add('gnode-dim');
        if (nm && linked.has(nm)) { c.classList.remove('gnode-dim'); c.classList.add('gnode-hot'); }
      });
      document.querySelectorAll('#graph-transform text').forEach(t2 => {
        if (t2.dataset.name && !linked.has(t2.dataset.name)) t2.style.opacity = '0.25';
      });
      document.querySelectorAll('#graph-transform line').forEach(l => {
        const [s2, t2] = (l.dataset.edge || '').split('→');
        if (s2 === name || t2 === name) l.classList.add('gedge-hot');
      });
    }

    svgEl.addEventListener('mousemove', (e) => {
      const circle = e.target.closest('circle[data-name]');
      if (circle && !graphDrag) {
        const name = circle.dataset.name;
        if (svgEl._focusName !== name) {
          svgEl._focusName = name;
          graphSetFocus(name);
        }
        const deg = graphEdges.filter(edge => edge.source === name || edge.target === name).length;
        tooltip.textContent = `${name}（${deg} 连接）`;
        tooltip.style.display = 'block';
        const rect = container.getBoundingClientRect();
        tooltip.style.left = (e.clientX - rect.left + 12) + 'px';
        tooltip.style.top = (e.clientY - rect.top - 30) + 'px';
      } else {
        tooltip.style.display = 'none';
        if (svgEl._focusName) { svgEl._focusName = null; graphClearFocus(); }
      }
    });

    svgEl.addEventListener('mouseleave', () => {
      tooltip.style.display = 'none';
      if (svgEl._focusName) { svgEl._focusName = null; graphClearFocus(); }
    });

    // Touch events for mobile graph interaction
    let touchStartDist = 0;
    let touchStartMid = null;
    let touchStartTransform = null;
    let singleTouchStart = null;
    let singleTouchNode = null;
    let singleTouchMoved = false;

    svgEl.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (e.touches.length === 1) {
        const touch = e.touches[0];
        const rect = container.getBoundingClientRect();
        const tx = touch.clientX - rect.left;
        const ty = touch.clientY - rect.top;
        // Check if touching a node
        const svgPt = svgEl.createSVGPoint();
        svgPt.x = tx; svgPt.y = ty;
        let hitNode = null;
        for (const node of graphNodes) {
          const dx = (node.x * graphTransform.k + graphTransform.x) - tx;
          const dy = (node.y * graphTransform.k + graphTransform.y) - ty;
          if (Math.sqrt(dx*dx + dy*dy) < 14) {
            hitNode = node;
            break;
          }
        }
        if (hitNode) {
          singleTouchNode = hitNode;
          singleTouchStart = { x: touch.clientX, y: touch.clientY };
          singleTouchMoved = false;
        } else {
          singleTouchStart = { x: touch.clientX, y: touch.clientY };
          singleTouchNode = null;
          singleTouchMoved = false;
          touchStartTransform = { x: graphTransform.x, y: graphTransform.y };
        }
      } else if (e.touches.length === 2) {
        singleTouchStart = null;
        singleTouchNode = null;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        touchStartDist = Math.sqrt(dx*dx + dy*dy);
        touchStartMid = {
          x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
          y: (e.touches[0].clientY + e.touches[1].clientY) / 2
        };
        touchStartTransform = { x: graphTransform.x, y: graphTransform.y, k: graphTransform.k };
      }
    }, { passive: false });

    svgEl.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = container.getBoundingClientRect();
      if (e.touches.length === 1 && singleTouchStart) {
        const touch = e.touches[0];
        const dx = touch.clientX - singleTouchStart.x;
        const dy = touch.clientY - singleTouchStart.y;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) singleTouchMoved = true;
        if (singleTouchNode) {
          const gx = (touch.clientX - rect.left - graphTransform.x) / graphTransform.k;
          const gy = (touch.clientY - rect.top - graphTransform.y) / graphTransform.k;
          singleTouchNode.x = gx;
          singleTouchNode.y = gy;
          updateGraphNode(singleTouchNode);
        } else {
          graphTransform.x = touchStartTransform.x + dx;
          graphTransform.y = touchStartTransform.y + dy;
          applyGraphTransform();
        }
      } else if (e.touches.length === 2 && touchStartDist > 0) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const scale = dist / touchStartDist;
        const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
        const my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
        const newK = Math.max(0.1, Math.min(5, touchStartTransform.k * scale));
        graphTransform.k = newK;
        graphTransform.x = mx - (mx - touchStartTransform.x) * (newK / touchStartTransform.k);
        graphTransform.y = my - (my - touchStartTransform.y) * (newK / touchStartTransform.k);
        applyGraphTransform();
      }
    }, { passive: false });

    svgEl.addEventListener('touchend', (e) => {
      if (singleTouchNode && !singleTouchMoved) {
        navigate('page', singleTouchNode.name);
      }
      singleTouchStart = null;
      singleTouchNode = null;
      touchStartDist = 0;
      touchStartMid = null;
      touchStartTransform = null;
    });

    document.getElementById('graph-zoom-in').addEventListener('click', () => {
      const s = document.getElementById('graph-svg');
      graphZoomAt(s.clientWidth / 2, s.clientHeight / 2, 1.3);
    });
    document.getElementById('graph-zoom-out').addEventListener('click', () => {
      const s = document.getElementById('graph-svg');
      graphZoomAt(s.clientWidth / 2, s.clientHeight / 2, 0.7);
    });
    document.getElementById('graph-reset').addEventListener('click', resetGraphView);
  }
}

function formatDate(s) {
  if (!s) return '';
  // Fast path: SQLite datetime format "YYYY-MM-DD HH:MM:SS" — return as-is
  if (typeof s === 'string' && s.length >= 19 && s[4] === '-' && s[10] === ' ') {
    return s.slice(0, 16);  // "YYYY-MM-DD HH:MM"
  }
  // Fallback for other formats (ISO, etc.)
  const d = new Date(s.replace(' ', 'T'));
  if (isNaN(d.getTime())) return s;
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ── Mermaid (lazy-loaded, theme-aware, error-degrades to source) ──

let mmdSeq = 0;

function ensureMermaidLoaded() {
  if (window.mermaid) return Promise.resolve();
  if (ensureMermaidLoaded._p) return ensureMermaidLoaded._p;
  // v9 UMD via plain <script> (same mechanism as CodeMirror/markdown-it on
  // cdnjs). v10+ ships ESM-only, which this embedded browser cannot load
  // remotely — do not "upgrade" without hosting the ESM bundle locally.
  ensureMermaidLoaded._p = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mermaid/9.4.3/mermaid.min.js';
    s.onload = () => resolve();
    s.onerror = () => { ensureMermaidLoaded._p = null; reject(new Error('mermaid CDN 加载失败')); };
    document.head.appendChild(s);
  });
  return ensureMermaidLoaded._p;
}

function initMermaidTheme() {
  if (!window.mermaid) return;
  const cs = getComputedStyle(document.documentElement);
  const v = (n) => cs.getPropertyValue(n).trim();
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: 'strict',
    theme: 'base',
    themeVariables: {
      background: 'transparent',
      mainBkg: v('--card'),
      primaryColor: v('--card'),
      primaryBorderColor: v('--accent'),
      primaryTextColor: v('--fg'),
      textColor: v('--fg'),
      lineColor: v('--muted'),
      secondaryColor: v('--tag-dim'),
      secondaryBorderColor: v('--tag'),
      secondaryTextColor: v('--fg'),
      tertiaryColor: v('--hover'),
      tertiaryBorderColor: v('--border'),
      tertiaryTextColor: v('--fg'),
      fontSize: '14px',
    },
  });
}

async function renderMermaidBlocks(root) {
  const blocks = (root || document).querySelectorAll('.mermaid');
  if (!blocks.length) return;
  try {
    await ensureMermaidLoaded();
  } catch (e) {
    return; // CDN unavailable: blocks keep their escaped source (code-block look)
  }
  initMermaidTheme();
  for (const b of blocks) {
    const src = b.dataset.src !== undefined ? b.dataset.src : b.textContent;
    b.dataset.src = src;
    b.classList.remove('mermaid-error');
    b.removeAttribute('data-processed'); // v9 init() skips nodes it already processed
    b.textContent = src; // reset before run: rerenders must start from raw source
  }
  try {
    mermaid.init(undefined, blocks); // v9: syntax errors render in-place per node
  } catch (e) { /* a fully broken block keeps its source text */ }
}

// ── Embed transclusion (![[page]]) ──────────────────────────────
// Placeholder divs from the kb_embed renderer get filled here, async,
// depth-limited (level >= 2 refuses to nest further → breaks cycles).

async function fillEmbeds(root, depth = 0) {
  const els = (root || document).querySelectorAll('.kb-embed:not([data-filled])');
  for (const el of els) {
    const name = el.dataset.embed;
    el.dataset.filled = '1';
    if (!name) { el.textContent = '(空嵌入)'; continue; }
    if (depth >= 2) {
      el.classList.add('kb-embed-max');
      el.textContent = `↪ 嵌入层级已达上限（${name}）`;
      continue;
    }
    el.innerHTML = '<div class="kb-embed-loading">加载嵌入…</div>';
    try {
      const page = await cachedFetch(`page:${name}`, `${API}/pages/${encodeURIComponent(name)}`);
      el.innerHTML = renderContent(page.content);
      await fillEmbeds(el, depth + 1);
      await markUnresolved(el);
    } catch (e) {
      el.classList.add('kb-embed-missing');
      el.innerHTML = `<span class="kb-embed-create" data-create="${escapeHtml(name)}">📄 ${escapeHtml(name)} 不存在 — 点击创建</span>`;
    }
  }
}

function relativeDate(s) {
  if (!s) return '';
  const d = new Date(s.replace(' ', 'T'));
  if (isNaN(d.getTime())) return formatDate(s);
  const diff = Date.now() - d.getTime();
  if (diff < 0) return formatDate(s);
  const min = Math.floor(diff / 60000);
  if (min < 1) return '刚刚';
  if (min < 60) return min + ' 分钟前';
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + ' 小时前';
  const day = Math.floor(hr / 24);
  if (day === 1) return '昨天';
  if (day < 7) return day + ' 天前';
  return s.slice(0, 10);
}

function timeGroupKey(s) {
  const d = new Date(s.replace(' ', 'T'));
  if (isNaN(d.getTime())) return '更早';
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const t = d.getTime();
  if (t >= todayStart) return '今天';
  if (t >= todayStart - 86400000) return '昨天';
  if (t >= todayStart - 7 * 86400000) return '本周';
  return '更早';
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function showToast(msg, type) {

  t.textContent = msg;
  t.className = type === 'error' ? 'error' : '';
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.display = 'none'; }, 2500);
}

// ── Link Hover Preview ───────────────────────────────────────

const lpCard = document.getElementById('link-preview-card');
const lpCache = new Map();   // name → {page or null, ts}
let lpTimer = null;
let lpHideTimer = null;
let lpCurrentLink = null;

function lpCacheGet(name) {
  const hit = lpCache.get(name);
  if (hit && Date.now() - hit.ts < 5 * 60 * 1000) return hit.page;
  lpCache.delete(name);
  return undefined;  // expired
}

function lpCacheSet(name, page) {
  if (lpCache.size >= 20) {
    lpCache.delete(lpCache.keys().next().value);
  }
  lpCache.set(name, { page, ts: Date.now() });
}

async function lpFetch(name) {
  const cached = lpCacheGet(name);
  if (cached !== undefined) return cached;
  try {
    const resp = await fetch(`${API}/pages/${encodeURIComponent(name)}`);
    const page = resp.ok ? await resp.json() : null;
    lpCacheSet(name, page);
    return page;
  } catch (e) {
    return null;
  }
}

function lpPosition(linkEl) {
  const rect = linkEl.getBoundingClientRect();
  const card = lpCard;
  card.style.visibility = 'hidden';
  card.classList.add('open');
  const cw = card.offsetWidth;
  const ch = card.offsetHeight;

  let x = rect.left;
  let y = rect.bottom + 8;
  if (y + ch > window.innerHeight - 8) {
    y = rect.top - ch - 8;
    if (y < 8) y = 8;
  }
  if (x + cw > window.innerWidth - 8) x = window.innerWidth - cw - 8;
  if (x < 8) x = 8;

  card.style.left = x + 'px';
  card.style.top = y + 'px';
  card.style.visibility = '';
}

async function lpShow(linkEl) {
  const name = linkEl.dataset.page;
  if (!name) return;
  lpCurrentLink = linkEl;

  const page = await lpFetch(name);
  if (lpCurrentLink !== linkEl) return;

  if (!page) {
    lpCard.innerHTML = `
      <div class="lp-title">📄 ${escapeHtml(name)}</div>
      <div class="lp-missing lp-create" data-create="${escapeHtml(name)}">➕ 页面不存在——点击创建</div>`;
  } else {
    const preview = page.content.length > 500
      ? page.content.slice(0, 500).replace(/\n\S.*$/s, '') + '\n…'
      : page.content;
    const backlinkCount = (page.backlinks || []).length;
    lpCard.innerHTML = `
      <div class="lp-title lp-goto" data-goto="${escapeHtml(page.name)}">📄 ${escapeHtml(page.name)}</div>
      <div class="lp-body">${renderContent(preview)}</div>
      <div class="lp-footer">🔗 ${backlinkCount} 个反向链接 · 更新于 ${formatDate(page.updated_at)}</div>`;
  }
  lpPosition(linkEl);
}

function lpHide() {
  lpCard.classList.remove('open');
  lpCurrentLink = null;
}

// Card click: create missing page, or navigate to existing
lpCard.addEventListener('click', (e) => {
  const createEl = e.target.closest('[data-create]');
  if (createEl) {
    const name = createEl.dataset.create;
    lpHide();
    newPage();
    document.getElementById('page-name').value = name;
    if (cm) cm.focus();
    return;
  }
  const gotoEl = e.target.closest('[data-goto]');
  if (gotoEl) {
    lpHide();
    navigate('page', gotoEl.dataset.goto);
  }
});

document.addEventListener('mouseover', (e) => {
  const link = e.target.closest('a[data-page]');
  if (!link) return;
  clearTimeout(lpHideTimer);
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => lpShow(link), 300);
});

document.addEventListener('mouseout', (e) => {
  const link = e.target.closest('a[data-page]');
  if (!link) return;
  clearTimeout(lpTimer);
  lpHideTimer = setTimeout(() => {
    if (!lpCard.matches(':hover')) lpHide();
  }, 200);
});

// Mobile: tap wikilink to show preview instead of navigating
document.addEventListener('click', (e) => {
  if (window.innerWidth > 768) return;
  const link = e.target.closest('a[data-page]');
  if (!link) return;
  if (link.classList.contains('unresolved')) return; // let normal click handle create
  e.preventDefault();
  e.stopPropagation();
  clearTimeout(lpTimer);
  lpShow(link);
});

window.addEventListener('scroll', lpHide, true);
document.addEventListener('click', (e) => {
  if (!e.target.closest('#link-preview-card')) lpHide();
}, true);

// ── Command Palette (Ctrl+K) ────────────────────────────────

function trackRecent(name) {
  try {
    let recent = JSON.parse(localStorage.getItem('kb_recent') || '[]');
    recent = recent.filter(r => r.name !== name);
    recent.unshift({ name, ts: Date.now() });
    recent = recent.slice(0, 10);
    localStorage.setItem('kb_recent', JSON.stringify(recent));
  } catch (e) { /* ignore */ }
}

function getRecent() {
  try {
    return JSON.parse(localStorage.getItem('kb_recent') || '[]');
  } catch (e) { return []; }
}

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return '刚刚';
  if (s < 3600) return `${Math.floor(s / 60)}分钟前`;
  if (s < 86400) return `${Math.floor(s / 3600)}小时前`;
  return `${Math.floor(s / 86400)}天前`;
}

function fuzzyScore(query, text) {
  const q = query.toLowerCase(), t = text.toLowerCase();
  const idx = t.indexOf(q);
  if (idx >= 0) return 1000 - idx;  // substring, earlier = better
  // subsequence fallback
  let qi = 0, score = 0;
  for (let ti = 0; ti < t.length && qi < q.length; ti++) {
    if (t[ti] === q[qi]) { qi++; score++; }
  }
  return qi === q.length ? score : -1;
}

const paletteActions = [
  { icon: '📄', label: '新建页面', hint: '编辑', run: () => newPage() },
  { icon: '📅', label: '今日日记', hint: '日记', run: () => navigate('journal') },
  { icon: '🗂', label: '所有页面', run: () => navigate('all') },
  { icon: '🕸', label: '知识图谱', run: () => navigate('graph') },
  { icon: '📋', label: '任务管理', run: () => navigate('todo') },
  { icon: '🏠', label: '回到首页', run: () => navigate('home') },
  { icon: '🌗', label: '切换深浅主题', run: () => {
      const cur = document.documentElement.getAttribute('data-theme') || 'dark';
      setTheme(cur === 'dark' ? 'light' : 'dark');
    } },
  { icon: '◀', label: '收起/展开侧边栏', run: () => document.getElementById('sidebar-toggle').click() },
  { icon: '📦', label: '导出 zip', hint: '备份', run: () => exportPages('zip') },
  { icon: '📦', label: '导出 JSON', hint: '备份', run: () => exportPages('json') },
  // Contextual: only when editing a page
  { icon: '💾', label: '保存页面', ctx: 'editing', run: () => savePage() },
  { icon: '🕘', label: '版本历史', ctx: 'editing', run: () => showVersionHistory() },
  { icon: '🗑', label: '删除页面', ctx: 'editing', run: () => deleteCurrentPage() },
];

let palItems = [];       // flat list of {icon, label, hint, section, run}
let palActiveIdx = -1;
let palFtsTimer = null;

function openPalette() {
  document.getElementById('palette-overlay').classList.add('open');
  const input = document.getElementById('palette-input');
  input.value = '';
  palItems = [];
  palActiveIdx = -1;
  renderPaletteEmpty();
  setTimeout(() => input.focus(), 0);
}

function closePalette() {
  document.getElementById('palette-overlay').classList.remove('open');
}

function renderPaletteEmpty() {
  // Empty state: recent pages + quick actions
  const recent = getRecent();
  const items = [];
  if (recent.length > 0) {
    for (const r of recent.slice(0, 5)) {
      items.push({ icon: '📄', label: r.name, hint: timeAgo(r.ts), section: '最近', run: () => navigate('page', r.name) });
    }
  }
  for (const a of paletteActions.filter(a => !a.ctx)) {
    if (items.length >= 12) break;
    items.push({ icon: a.icon, label: a.label, hint: a.hint || '', section: items.length === (recent.length > 0 ? 5 : 0) ? '操作' : '操作', run: a.run });
  }
  palItems = items;
  renderPaletteResults();
}

async function handlePaletteInput() {
  const raw = document.getElementById('palette-input').value;
  palActiveIdx = -1;

  if (!raw.trim()) { renderPaletteEmpty(); return; }

  const prefix = raw[0];
  const query = raw.slice(1).trim();
  const items = [];

  if (prefix === '>') {
    // Actions only
    const editing = document.getElementById('editor').style.display === 'block' && currentSaveMode === 'page';
    for (const a of paletteActions) {
      if (a.ctx === 'editing' && !editing) continue;
      if (!query || fuzzyScore(query, a.label) > 0) {
        items.push({ icon: a.icon, label: a.label, hint: a.hint || '', section: '操作', run: a.run });
      }
    }
    palItems = items;
    renderPaletteResults();
  } else if (prefix === '+') {
    // Quick capture: create page with this name
    const name = query;
    if (name) {
      items.push({ icon: '➕', label: `创建页面「${name}」`, hint: '快速捕获', section: '创建', run: () => {
        newPage();
        document.getElementById('page-name').value = name;
        if (cm) cm.focus();
      }});
    }
    palItems = items;
    renderPaletteResults();
  } else if (prefix === '#') {
    // Tags only
    try {
      const tags = await cachedFetch('tags', `${API}/tags`);
      for (const t of tags) {
        if (!query || fuzzyScore(query, t.name) > 0) {
          items.push({ icon: '#', label: t.name, hint: `${t.count} 页`, section: '标签', run: () => navigate('tag', t.name) });
        }
      }
    } catch (e) { /* ignore */ }
    palItems = items;
    renderPaletteResults();
  } else {
    // Mixed: pages + tags + actions, FTS content fallback
    const q = raw.trim();
    const pageCache = allPages.length > 0 ? allPages : (await refreshAllPagesCache());
    for (const p of pageCache) {
      const sc = fuzzyScore(q, p.name);
      if (sc > 0) {
        items.push({ icon: '📄', label: p.name, hint: '', section: '页面', score: sc, run: () => navigate('page', p.name) });
      }
    }
    items.sort((a, b) => b.score - a.score);
    const nameMatches = new Set(items.map(i => i.label.toLowerCase()));

    // Tags (limit 5)
    try {
      const tags = await cachedFetch('tags', `${API}/tags`);
      const tagItems = [];
      for (const t of tags) {
        const sc = fuzzyScore(q, t.name);
        if (sc > 0) tagItems.push({ icon: '#', label: t.name, hint: `${t.count} 页`, section: '标签', score: sc, run: () => navigate('tag', t.name) });
      }
      tagItems.sort((a, b) => b.score - a.score);
      items.push(...tagItems.slice(0, 5));
    } catch (e) { /* ignore */ }

    // Actions (limit 3)
    const editing = document.getElementById('editor').style.display === 'block' && currentSaveMode === 'page';
    for (const a of paletteActions) {
      if (a.ctx === 'editing' && !editing) continue;
      if (fuzzyScore(q, a.label) > 0) {
        items.push({ icon: a.icon, label: a.label, hint: a.hint || '', section: '操作', run: a.run });
      }
    }

    palItems = items;
    renderPaletteResults();

    // FTS content fallback (debounced, only if few name matches)
    clearTimeout(palFtsTimer);
    if (q.length >= 3 && items.filter(i => i.section === '页面').length < 3) {
      palFtsTimer = setTimeout(async () => {
        try {
          const resp = await fetch(`${API}/pages?search=${encodeURIComponent(q)}&limit=5`);
          if (!resp.ok) return;
          const results = await resp.json();
          const ftsItems = [];
          for (const r of (Array.isArray(results) ? results : [])) {
            const rn = r.name;
            if (!rn || nameMatches.has(rn.toLowerCase())) continue;
            ftsItems.push({ icon: '🔎', label: rn, hint: '内容匹配', section: '内容匹配', run: () => navigate('page', rn) });
          }
          if (ftsItems.length > 0 && document.getElementById('palette-overlay').classList.contains('open')) {
            // Only add if input unchanged
            if (document.getElementById('palette-input').value.trim() === q) {
              palItems.push(...ftsItems);
              renderPaletteResults();
            }
          }
        } catch (e) { /* ignore */ }
      }, 250);
    }
  }
}

async function refreshAllPagesCache() {
  try {
    const names = await cachedFetch('names', `${API}/pages/names`);
    allPages = names.map(n => ({ name: n }));
    return allPages;
  } catch (e) { /* ignore */ }
  return allPages;
}

function renderPaletteResults() {
  const box = document.getElementById('palette-results');
  if (palItems.length === 0) {
    box.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted)">无匹配结果</div>';
    return;
  }
  let html = '';
  let lastSection = '';
  palItems.forEach((item, i) => {
    if (item.section !== lastSection) {
      html += `<div class="pal-section">${item.section}</div>`;
      lastSection = item.section;
    }
    const active = i === palActiveIdx ? ' active' : '';
    const hint = item.hint ? `<span class="pal-hint">${escapeHtml(item.hint)}</span>` : '';
    html += `<div class="pal-item${active}" data-idx="${i}" onclick="executePaletteItem(${i})" onmouseenter="setPalActive(${i})">
      <span class="pal-icon">${item.icon}</span>
      <span>${escapeHtml(item.label)}</span>${hint}
    </div>`;
  });
  box.innerHTML = html;
}

function setPalActive(i) {
  palActiveIdx = i;
  document.querySelectorAll('#palette-results .pal-item').forEach(el => {
    el.classList.toggle('active', +el.dataset.idx === i);
  });
  const active = document.querySelector('#palette-results .pal-item.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

function executePaletteItem(i) {
  const item = palItems[i];
  if (!item) return;
  closePalette();
  item.run();
}

// Palette keyboard handling
document.getElementById('palette-input').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (palItems.length > 0) setPalActive(Math.min(palActiveIdx + 1, palItems.length - 1));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (palItems.length > 0) setPalActive(Math.max(palActiveIdx - 1, 0));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    executePaletteItem(palActiveIdx >= 0 ? palActiveIdx : 0);
  } else if (e.key === 'Escape') {
    e.preventDefault();
    closePalette();
  }
});

document.getElementById('palette-input').addEventListener('input', handlePaletteInput);

document.getElementById('palette-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'palette-overlay') closePalette();
});

// Global Ctrl+K
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    const overlay = document.getElementById('palette-overlay');
    if (overlay.classList.contains('open')) closePalette();
    else openPalette();
  }
});

// ── Boot ────────────────────────────────────────────────────────

// Fix logo href for path-prefix deployments
const logoLink = document.querySelector('.nav-text');
if (logoLink) logoLink.href = BASE + '/';

// Inject user-defined custom CSS (data/custom.css)
(async function loadCustomCSS() {
  try {
    const resp = await fetch(`${API}/custom.css`, { cache: 'no-store' });
    if (resp.ok) {
      const css = await resp.text();
      let styleEl = document.getElementById('custom-css');
      if (!styleEl) {
        styleEl = document.createElement('style');
        styleEl.id = 'custom-css';
        document.head.appendChild(styleEl);
      }
      styleEl.textContent = css;
    }
  } catch (e) { /* ignore */ }
})();

// Route from initial URL (deep link / refresh / shared link)
navigateFromUrl();
</script>
