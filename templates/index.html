function trackRecent(name) {
  try {
    let recent = JSON.parse(localStorage.getItem('kb_recent') || '[]');
    recent = recent.filter(r => r.name !== name);
    recent.unshift({ name, ts: Date.now() });
    recent = recent.slice(0, 10);
    localStorage.setItem('kb_recent', JSON.stringify(recent));
  } catch (e) { /* ignore */ }
}

function getRecent() {
  try {
    return JSON.parse(localStorage.getItem('kb_recent') || '[]');
  } catch (e) { return []; }
}

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return '刚刚';
  if (s < 3600) return `${Math.floor(s / 60)}分钟前`;
  if (s < 86400) return `${Math.floor(s / 3600)}小时前`;
  return `${Math.floor(s / 86400)}天前`;
}

function fuzzyScore(query, text) {
  const q = query.toLowerCase(), t = text.toLowerCase();
  const idx = t.indexOf(q);
  if (idx >= 0) return 1000 - idx;  // substring, earlier = better
  // subsequence fallback
  let qi = 0, score = 0;
  for (let ti = 0; ti < t.length && qi < q.length; ti++) {
    if (t[ti] === q[qi]) { qi++; score++; }
  }
  return qi === q.length ? score : -1;
}

const paletteActions = [
  { icon: '📄', label: '新建页面', hint: '编辑', run: () => newPage() },
  { icon: '📅', label: '今日日记', hint: '日记', run: () => navigate('journal') },
  { icon: '🗂', label: '所有页面', run: () => navigate('all') },
  { icon: '🕸', label: '知识图谱', run: () => navigate('graph') },
  { icon: '📋', label: '任务管理', run: () => navigate('todo') },
  { icon: '🏠', label: '回到首页', run: () => navigate('home') },
  { icon: '🌗', label: '切换深浅主题', run: () => {
      const cur = document.documentElement.getAttribute('data-theme') || 'dark';
      setTheme(cur === 'dark' ? 'light' : 'dark');
    } },
  { icon: '◀', label: '收起/展开侧边栏', run: () => document.getElementById('sidebar-toggle').click() },
  { icon: '📦', label: '导出 zip', hint: '备份', run: () => exportPages('zip') },
  { icon: '📦', label: '导出 JSON', hint: '备份', run: () => exportPages('json') },
  // Contextual: only when editing a page
  { icon: '💾', label: '保存页面', ctx: 'editing', run: () => savePage() },
  { icon: '🕘', label: '版本历史', ctx: 'editing', run: () => showVersionHistory() },
  { icon: '🗑', label: '删除页面', ctx: 'editing', run: () => deleteCurrentPage() },
];

let palItems = [];       // flat list of {icon, label, hint, section, run}
let palActiveIdx = -1;
let palFtsTimer = null;

function openPalette() {
  document.getElementById('palette-overlay').classList.add('open');
  const input = document.getElementById('palette-input');
  input.value = '';
  palItems = [];
  palActiveIdx = -1;
  renderPaletteEmpty();
  setTimeout(() => input.focus(), 0);
}

function closePalette() {
  document.getElementById('palette-overlay').classList.remove('open');
}

function renderPaletteEmpty() {
  // Empty state: recent pages + quick actions
  const recent = getRecent();
  const items = [];
  if (recent.length > 0) {
    for (const r of recent.slice(0, 5)) {
      items.push({ icon: '📄', label: r.name, hint: timeAgo(r.ts), section: '最近', run: () => navigate('page', r.name) });
    }
  }
  for (const a of paletteActions.filter(a => !a.ctx)) {
    if (items.length >= 12) break;
    items.push({ icon: a.icon, label: a.label, hint: a.hint || '', section: items.length === (recent.length > 0 ? 5 : 0) ? '操作' : '操作', run: a.run });
  }
  palItems = items;
  renderPaletteResults();
}

async function handlePaletteInput() {
  const raw = document.getElementById('palette-input').value;
  palActiveIdx = -1;

  if (!raw.trim()) { renderPaletteEmpty(); return; }

  const prefix = raw[0];
  const query = raw.slice(1).trim();
  const items = [];

  if (prefix === '>') {
    // Actions only
    const editing = document.getElementById('editor').style.display === 'block' && currentSaveMode === 'page';
    for (const a of paletteActions) {
      if (a.ctx === 'editing' && !editing) continue;
      if (!query || fuzzyScore(query, a.label) > 0) {
        items.push({ icon: a.icon, label: a.label, hint: a.hint || '', section: '操作', run: a.run });
      }
    }
    palItems = items;
    renderPaletteResults();
  } else if (prefix === '+') {
    // Quick capture: create page with this name
    const name = query;
    if (name) {
      items.push({ icon: '➕', label: `创建页面「${name}」`, hint: '快速捕获', section: '创建', run: () => {
        newPage();
        document.getElementById('page-name').value = name;
        if (cm) cm.focus();
      }});
    }
    palItems = items;
    renderPaletteResults();
  } else if (prefix === '#') {
    // Tags only
    try {
      const tags = await cachedFetch('tags', `${API}/tags`);
      for (const t of tags) {
        if (!query || fuzzyScore(query, t.name) > 0) {
          items.push({ icon: '#', label: t.name, hint: `${t.count} 页`, section: '标签', run: () => navigate('tag', t.name) });
        }
      }
    } catch (e) { /* ignore */ }
    palItems = items;
    renderPaletteResults();
  } else {
    // Mixed: pages + tags + actions, FTS content fallback
    const q = raw.trim();
    const pageCache = allPages.length > 0 ? allPages : (await refreshAllPagesCache());
    for (const p of pageCache) {
      const sc = fuzzyScore(q, p.name);
      if (sc > 0) {
        items.push({ icon: '📄', label: p.name, hint: '', section: '页面', score: sc, run: () => navigate('page', p.name) });
      }
    }
    items.sort((a, b) => b.score - a.score);
    const nameMatches = new Set(items.map(i => i.label.toLowerCase()));

    // Tags (limit 5)
    try {
      const tags = await cachedFetch('tags', `${API}/tags`);
      const tagItems = [];
      for (const t of tags) {
        const sc = fuzzyScore(q, t.name);
        if (sc > 0) tagItems.push({ icon: '#', label: t.name, hint: `${t.count} 页`, section: '标签', score: sc, run: () => navigate('tag', t.name) });
      }
      tagItems.sort((a, b) => b.score - a.score);
      items.push(...tagItems.slice(0, 5));
    } catch (e) { /* ignore */ }

    // Actions (limit 3)
    const editing = document.getElementById('editor').style.display === 'block' && currentSaveMode === 'page';
    for (const a of paletteActions) {
      if (a.ctx === 'editing' && !editing) continue;
      if (fuzzyScore(q, a.label) > 0) {
        items.push({ icon: a.icon, label: a.label, hint: a.hint || '', section: '操作', run: a.run });
      }
    }

    palItems = items;
    renderPaletteResults();

    // FTS content fallback (debounced, only if few name matches)
    clearTimeout(palFtsTimer);
    if (q.length >= 3 && items.filter(i => i.section === '页面').length < 3) {
      palFtsTimer = setTimeout(async () => {
        try {
          const resp = await fetch(`${API}/pages?search=${encodeURIComponent(q)}&limit=5`);
          if (!resp.ok) return;
          const results = await resp.json();
          const ftsItems = [];
          for (const r of (Array.isArray(results) ? results : [])) {
            const rn = r.name;
            if (!rn || nameMatches.has(rn.toLowerCase())) continue;
            ftsItems.push({ icon: '🔎', label: rn, hint: '内容匹配', section: '内容匹配', run: () => navigate('page', rn) });
          }
          if (ftsItems.length > 0 && document.getElementById('palette-overlay').classList.contains('open')) {
            // Only add if input unchanged
            if (document.getElementById('palette-input').value.trim() === q) {
              palItems.push(...ftsItems);
              renderPaletteResults();
            }
          }
        } catch (e) { /* ignore */ }
      }, 250);
    }
  }
}

async function refreshAllPagesCache() {
  try {
    const names = await cachedFetch('names', `${API}/pages/names`);
    allPages = names.map(n => ({ name: n }));
    return allPages;
  } catch (e) { /* ignore */ }
  return allPages;
}

function renderPaletteResults() {
  const box = document.getElementById('palette-results');
  if (palItems.length === 0) {
    box.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted)">无匹配结果</div>';
    return;
  }
  let html = '';
  let lastSection = '';
  palItems.forEach((item, i) => {
    if (item.section !== lastSection) {
      html += `<div class="pal-section">${item.section}</div>`;
      lastSection = item.section;
    }
    const active = i === palActiveIdx ? ' active' : '';
    const hint = item.hint ? `<span class="pal-hint">${escapeHtml(item.hint)}</span>` : '';
    html += `<div class="pal-item${active}" data-idx="${i}" onclick="executePaletteItem(${i})" onmouseenter="setPalActive(${i})">
      <span class="pal-icon">${item.icon}</span>
      <span>${escapeHtml(item.label)}</span>${hint}
    </div>`;
  });
  box.innerHTML = html;
}

function setPalActive(i) {
  palActiveIdx = i;
  document.querySelectorAll('#palette-results .pal-item').forEach(el => {
    el.classList.toggle('active', +el.dataset.idx === i);
  });
  const active = document.querySelector('#palette-results .pal-item.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

function executePaletteItem(i) {
  const item = palItems[i];
  if (!item) return;
  closePalette();
  item.run();
}

// Palette keyboard handling
document.getElementById('palette-input').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (palItems.length > 0) setPalActive(Math.min(palActiveIdx + 1, palItems.length - 1));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (palItems.length > 0) setPalActive(Math.max(palActiveIdx - 1, 0));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    executePaletteItem(palActiveIdx >= 0 ? palActiveIdx : 0);
  } else if (e.key === 'Escape') {
    e.preventDefault();
    closePalette();
  }
});

document.getElementById('palette-input').addEventListener('input', handlePaletteInput);

document.getElementById('palette-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'palette-overlay') closePalette();
});

// Global Ctrl+K
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    const overlay = document.getElementById('palette-overlay');
    if (overlay.classList.contains('open')) closePalette();
    else openPalette();
  }
});

// ── Boot ────────────────────────────────────────────────────────

// Fix logo href for path-prefix deployments
const logoLink = document.querySelector('.nav-text');
if (logoLink) logoLink.href = BASE + '/';

// Route from initial URL (deep link / refresh / shared link)
navigateFromUrl();
</script>
