services:
  kb:
    build:
      context: .
      # The container user must own the bind-mounted data directory, otherwise
      # it cannot write kb.db / custom.css. Set these to your host user:
      #   KB_UID=$(id -u) KB_GID=$(id -g) docker compose up -d --build
      args:
        KB_UID: ${KB_UID:-1000}
        KB_GID: ${KB_GID:-1000}
    container_name: kb
    ports:
      # Loopback only: nginx proxies from the host. Prevents direct external
      # access that could otherwise spoof X-Forwarded-For past the whitelist.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - KB_DB_PATH=/app/data/kb.db
      - KB_IP_WHITELIST=1
      - KB_ALLOWED_CIDRS=100.64.0.0/10,127.0.0.0/8,::1/128,fd7a:115c:a1e0::/48
      # nginx reaches the container through the Docker bridge gateway
      # (172.17.0.1), so XFF is trusted from loopback + 172.16.0.0/12.
      - KB_TRUSTED_PROXIES=127.0.0.0/8,::1/128,172.16.0.0/12
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/pages?limit=1', timeout=5).read(100)"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
